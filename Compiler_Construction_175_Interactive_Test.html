number":41,"local":1,"group":"topic-5","topic":"Context-free grammars and languages","page":12,"q":"What is the main purpose of a context-free grammar (CFG)?","options":{"A":"To allocate memory locations to identifiers","B":"To convert intermediate code into object code","C":"To identify the data types of program variables","D":"To generate possible strings in a formal language"},"correct":"D","source":"Notes 1.pdf, p. 2"},{"id":"CC-042","number":42,"local":2,"group":"topic-5","topic":"Context-free grammars and languages","page":12,"q":"In the CFG representation G=(V,T,P,S), what does T represent?","options":{"A":"A finite set of terminal symbols","B":"A finite set of non-terminal symbols","C":"A collection of production rules","D":"The starting symbol of the grammar"},"correct":"A","source":"Notes 1.pdf, p. 2"},{"id":"CC-043","number":43,"local":3,"group":"topic-5","topic":"Context-free grammars and languages","page":12,"q":"In the CFG representation G=(V,T,P,S), what does P represent?","options":{"A":"The set of terminal symbols","B":"The set of non-terminal symbols","C":"The set of production rules","D":"The start symbol of the grammar"},"correct":"C","source":"Notes 1.pdf, p. 2"},{"id":"CC-044","number":44,"local":4,"group":"topic-5","topic":"Context-free grammars and languages","page":12,"q":"What does S represent in a context-free grammar?","options":{"A":"The set of generated strings","B":"The start symbol of the grammar","C":"The set of terminal symbols","D":"The set of production rules"},"correct":"B","source":"Notes 1.pdf, p. 2"},{"id":"CC-045","number":45,"local":5,"group":"topic-5","topic":"Context-free grammars and languages","page":12,"q":"What is a context-free language?","options":{"A":"A language generated through a lexical analyzer","B":"A language generated using a context-free grammar","C":"A language generated from optimized machine code","D":"A language generated by a symbol-table manager"},"correct":"B","source":"Notes 1.pdf, p. 2"},{"id":"CC-046","number":46,"local":6,"group":"topic-5","topic":"Context-free grammars and languages","page":13,"q":"According to the notes, context-free languages are not closed under which pair of operations?","options":{"A":"Intersection and complement","B":"Union and concatenation","C":"Union and Kleene closure","D":"Concatenation and Kleene closure"},"correct":"A","source":"Notes 1.pdf, p. 2"},{"id":"CC-047","number":47,"local":7,"group":"topic-5","topic":"Context-free grammars and languages","page":13,"q":"Which computational model is stated to accept context-free languages?","options":{"A":"A lexical analyzer using token patterns","B":"A compiler performing code generation","C":"A deterministic finite automaton","D":"A pushdown automaton"},"correct":"D","source":"Notes 1.pdf, p. 2"},{"id":"CC-048","number":48,"local":8,"group":"topic-5","topic":"Context-free grammars and languages","page":13,"q":"When is a context-free grammar classified as recursive?","options":{"A":"When it generates a finite number of strings","B":"When it generates exactly one derivation tree","C":"When it generates an infinite number of strings","D":"When it generates multiple derivation trees"},"correct":"C","source":"Notes 1.pdf, p. 2"},{"id":"CC-049","number":49,"local":9,"group":"topic-5","topic":"Context-free grammars and languages","page":13,"q":"When is a context-free grammar classified as non-recursive according to the notes?","options":{"A":"When it produces more than one derivation tree","B":"When it permits infinite strings through recursion","C":"When it generates a finite number of strings","D":"When it produces multiple leftmost derivations"},"correct":"C","source":"Notes 1.pdf, p. 2"},{"id":"CC-050","number":50,"local":10,"group":"topic-5","topic":"Context-free grammars and languages","page":13,"q":"When is a grammar considered ambiguous?","options":{"A":"When more than one derivation tree exists for a given input string","B":"When exactly one derivation tree exists for a given input string","C":"When the grammar generates a finite number of possible strings","D":"When the grammar contains both terminals and non-terminals"},"correct":"A","source":"Notes 1.pdf, p. 2"},{"id":"CC-051","number":51,"local":1,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":14,"q":"Under which condition is a grammar production considered left-recursive?","options":{"A":"The rightmost variable on the RHS matches the LHS variable","B":"The first terminal on the RHS matches a terminal on the LHS","C":"The RHS contains multiple occurrences of terminal symbols","D":"The leftmost variable on the RHS matches the LHS variable"},"correct":"D","source":"Notes 1.pdf, p. 3"},{"id":"CC-052","number":52,"local":2,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":14,"q":"Which condition identifies right recursion in a grammar production?","options":{"A":"The leftmost RHS variable matches the LHS variable","B":"The first RHS terminal matches the final RHS terminal","C":"The rightmost RHS variable matches the LHS variable","D":"The RHS contains a terminal followed by another terminal"},"correct":"C","source":"Notes 1.pdf, p. 3"},{"id":"CC-053","number":53,"local":3,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":14,"q":"Why should left recursion be eliminated from a grammar used by a top-down parser?","options":{"A":"It prevents the lexical analyzer from generating tokens","B":"It creates difficulties during target-code optimization","C":"It prevents the symbol table from storing identifiers","D":"It creates a problematic situation for top-down parsing"},"correct":"D","source":"Notes 1.pdf, p. 3"},{"id":"CC-054","number":54,"local":4,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":14,"q":"Which statement about right recursion is supported by the notes?","options":{"A":"It must be eliminated before lexical analysis begins","B":"It produces more than one parse tree for every string","C":"It does not create problems for top-down parsers","D":"It prevents the construction of grammar derivations"},"correct":"C","source":"Notes 1.pdf, p. 3"},{"id":"CC-055","number":55,"local":5,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":14,"q":"Which approach is described for removing ambiguity from a grammar?","options":{"A":"Replacing its terminals with non-terminals and applying lexical rules","B":"Removing its start symbol and introducing a new token sequence","C":"Rewriting the grammar or applying precedence and associativity constraints","D":"Replacing its production rules with intermediate-code instructions"},"correct":"C","source":"Notes 1.pdf, p. 3"},{"id":"CC-056","number":56,"local":6,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":15,"q":"According to the precedence rules in the notes, what happens when an operator's production is at a higher grammar level?","options":{"A":"The operator has higher priority than operators at lower levels","B":"The operator becomes right-associative within that production","C":"The operator has lower priority than operators at lower levels","D":"The operator becomes left-associative within that production"},"correct":"C","source":"Notes 1.pdf, p. 3"},{"id":"CC-057","number":57,"local":7,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":15,"q":"Which type of recursion should be used to express a left-associative operator?","options":{"A":"Left recursion","B":"Right recursion","C":"Indirect recursion","D":"Non-recursive production"},"correct":"A","source":"Notes 1.pdf, p. 4"},{"id":"CC-058","number":58,"local":8,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":15,"q":"Which type of recursion is used to implement right associativity?","options":{"A":"Left recursion in the operator's production","B":"Right recursion in the operator's production","C":"Both left and right recursion in the same production","D":"Removal of recursion from the operator's production"},"correct":"B","source":"Notes 1.pdf, p. 4"},{"id":"CC-059","number":59,"local":9,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":15,"q":"Consider the grammar E → E-F | F; F → F*T | T; T → id. Which symbol is assigned the highest priority in the example?","options":{"A":"The - operator","B":"The * operator","C":"The id symbol","D":"The E non-terminal"},"correct":"C","source":"Notes 1.pdf, p. 4"},{"id":"CC-060","number":60,"local":10,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":15,"q":"In the grammar E → E-F | F; F → F*T | T; T → id, which statement correctly describes the relative priority of * and -?","options":{"A":"Both operators have the same priority","B":"The - operator has higher priority than *","C":"Both operators are assigned the lowest grammar level","D":"The * operator has higher priority than -"},"correct":"D","source":"Notes 1.pdf, p. 4"},{"id":"CC-061","number":61,"local":11,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":16,"q":"Consider the production E → F + E. What does the recursion indicate about the + operator?","options":{"A":"The operator is left-associative","B":"The operator is non-associative","C":"The operator is right-associative","D":"The operator has the highest priority"},"correct":"C","source":"Notes 1.pdf, p. 4"},{"id":"CC-062","number":62,"local":12,"group":"topic-6","topic":"Ambiguity, recursion, precedence and associativity","page":16,"q":"Consider E → E + P | P; P → P * Q | Q; Q → id. Why does * have higher precedence than + in this grammar?","options":{"A":"Its production is placed at a higher grammar level","B":"Its production is placed at a lower grammar level","C":"Its production contains more recursive alternatives","D":"Its production has a different start non-terminal"},"correct":"B","source":"Notes 1.pdf, pp. 5-6"},{"id":"CC-063","number":63,"local":1,"group":"topic-7","topic":"Derivations and parse trees","page":16,"q":"What is a derivation in the context of a formal grammar?","options":{"A":"A representation of the symbol table and its entries","B":"A process of translating tokens into machine instructions","C":"A representation of identifiers and their data types","D":"A sequence of production rules used to determine string membership"},"correct":"D","source":"Notes 1.pdf, p. 6"},{"id":"CC-064","number":64,"local":2,"group":"topic-7","topic":"Derivations and parse trees","page":16,"q":"What characterizes a leftmost derivation?","options":{"A":"The rightmost non-terminal is replaced at each derivation step","B":"The leftmost non-terminal is replaced at each derivation step","C":"The non-terminal with the fewest productions is replaced first","D":"The non-terminal with the highest operator priority is replaced first"},"correct":"B","source":"Notes 1.pdf, p. 6"},{"id":"CC-065","number":65,"local":3,"group":"topic-7","topic":"Derivations and parse trees","page":17,"q":"Which statement describes a rightmost derivation?","options":{"A":"The first terminal is replaced before the remaining terminals","B":"The leftmost variable is replaced during each production step","C":"The start symbol is replaced after the remaining productions","D":"The rightmost non-terminal is replaced during each production step"},"correct":"D","source":"Notes 1.pdf, p. 6"},{"id":"CC-066","number":66,"local":4,"group":"topic-7","topic":"Derivations and parse trees","page":17,"q":"What does the root node of a parse tree represent?","options":{"A":"The final terminal generated during derivation","B":"The final production rule applied to the string","C":"The last non-terminal replaced during derivation","D":"The start symbol of the given grammar"},"correct":"D","source":"Notes 1.pdf, p. 6"},{"id":"CC-067","number":67,"local":5,"group":"topic-7","topic":"Derivations and ":"B","source":"Notes 1.pdf, p. 10"},{"id":"CC-076","number":76,"local":6,"group":"topic-8","topic":"Top-down parsing and recursive-descent parsing","page":19,"q":"What is a limitation of recursive-descent parsing with backtracking?","options":{"A":"It cannot construct a parse tree from the start symbol","B":"It cannot process non-terminals having alternative productions","C":"It requires the input to be scanned from right to left","D":"Its backtracking cost increases with many alternatives"},"correct":"D","source":"Notes 1.pdf, p. 11"},{"id":"CC-077","number":77,"local":7,"group":"topic-8","topic":"Top-down parsing and recursive-descent parsing","page":19,"q":"What is the key requirement when a recursive-descent parser operates without backtracking?","options":{"A":"Every grammar production must contain a terminal symbol","B":"The correct production alternative must be selected initially","C":"The parser must first construct the rightmost derivation","D":"The parser must reduce the input before reading terminals"},"correct":"B","source":"Notes 1.pdf, p. 11"},{"id":"CC-078","number":78,"local":8,"group":"topic-8","topic":"Top-down parsing and recursive-descent parsing","page":19,"q":"What happens if a recursive-descent parser without backtracking selects an incorrect alternative?","options":{"A":"It produces a syntactic error","B":"It switches to another alternative","C":"It generates a second parse tree","D":"It performs a rightmost derivation"},"correct":"A","source":"Notes 1.pdf, p. 11"},{"id":"CC-079","number":79,"local":9,"group":"topic-8","topic":"Top-down parsing and recursive-descent parsing","page":20,"q":"Which grammar characteristic is required by the backtracking-free recursive-descent method described in the notes?","options":{"A":"Every production must contain a recursive non-terminal","B":"Alternative productions must not have common prefixes","C":"Every non-terminal must have several possible expansions","D":"Alternative productions must start with i ,"topic":"Syntax trees, DAGs, postfix and three-address code","page":32,"q":"Consider a = b*(-c) + b*(-c). Which complete multiplication subexpression is repeated and can be shared in a DAG?","options":{"A":"b*c","B":"b*(-c)","C":"a*(-c)","D":"a*b"},"correct":"B","source":"Notes 2.pdf, p. 6"},{"id":"CC-138","number":138,"local":13,"group":"topic-13","topic":"Syntax trees, DAGs, postfix and three-address code","page":32,"q":"In the TAC example for a = b*(-c) + b*(-c), which assignment represents the first unary negation?","options":{"A":"t1 = b*c","B":"t1 = b-c","C":"t1 = b+c","D":"t1 = -c"},"correct":"D","source":"Notes 2.pdf, pp. 6, 11"},{"id":"CC-139","number":139,"local":14,"group":"topic-13","topic":"Syntax trees, DAGs, postfix and three-address code","page":32,"q":"Consider x = a*a + a*a*b + b*b. Which multiplication subexpression occurs repeatedly?","options":{"A":"a+b","B":"a*b","C":"a*a","D":"b+a"},"correct":"C","source":"Notes 2.pdf, p. 12"},{"id":"CC-140","number":140,"local":15,"group":"topic-13","topic":"Syntax trees, DAGs, postfix and three-address code","page":32,"q":"What is the role of variables such as t1, t2 and t3 in the TAC examples?","options":{"A":"They identify grammar productions used during parsing","B":"They store intermediate results of expression operations","C":"They identify terminal symbols in the source language","D":"They store the final states of a lexical automaton"},"correct":"B","source":"Notes 2.pdf, pp. 3, 5-6"},{"id":"CC-141","number":141,"local":1,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":33,"q":"What is a Syntax-Directed Definition (SDD)?","options":{"A":"A context-free grammar with attributes and semantic rules","B":"A regular grammar with lexical patterns and tokens","C":"A parsing table with states and reduction actions","D":"An intermediate representation with operators and results"},"correct":"A","source":"Notes 2.pdf, p. 13"},{"id":"CC-142","number":142,"local":2,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":33,"q":"In a Syntax-Directed Definition, attributes are associated with which elements?","options":{"A":"Grammar symbols","B":"Parsing states","C":"Machine registers","D":"Source-code lines"},"correct":"A","source":"Notes 2.pdf, p. 13"},{"id":"CC-143","number":143,"local":3,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":33,"q":"In an SDD, semantic rules are associated with which elements?","options":{"A":"Lexical tokens","B":"Parsing states","C":"Grammar productions","D":"Target instructions"},"correct":"C","source":"Notes 2.pdf, p. 13"},{"id":"CC-144","number":144,"local":4,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":33,"q":"Which of the following is explicitly listed as an application of SDD?","options":{"A":"Checking the types used in a program","B":"Loading an executable file into memory","C":"Linking multiple object files together","D":"Moving LR parsing items between states"},"correct":"A","source":"Notes 2.pdf, p. 13"},{"id":"CC-145","number":145,"local":5,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":33,"q":"What characterizes Syntax-Directed Translation (SDT)?","options":{"A":"Semantic actions are embedded within production bodies","B":"Semantic actions are stored within lexical token tables","C":"Semantic actions are represented by LR parsing states","D":"Semantic actions are stored as machine-code instructions"},"correct":"A","source":"Notes 2.pdf, p. 13"},{"id":"CC-146","number":146,"local":6,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":34,"q":"Which type of expression conversion is demonstrated using SDT in the notes?","options":{"A":"Prefix notation into infix notation","B":"Infix notation into postfix notation","C":"Postfix notation into prefix notation","D":"Infix notation into prefix notation"},"correct":"B","source":"Notes 2.pdf, pp. 13, 15"},{"id":"CC-147","number":147,"local":7,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":34,"q":"How does a synthesized attribute obtain its value?","options":{"A":"From the parent node of the parse tree","B":"From sibling nodes of the parse tree","C":"From child nodes of the parse tree","D":"From lookahead symbols of the parser"},"correct":"C","source":"Notes 2.pdf, p. 13"},{"id":"CC-148","number":148,"local":8,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":34,"q":"How does an inherited attribute obtain its value?","options":{"A":"From its parent or sibling nodes","B":"From its child nodes exclusively","C":"From the final target instructions","D":"From the scanner's token patterns"},"correct":"A","source":"Notes 2.pdf, p. 13"},{"id":"CC-149","number":149,"local":9,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":34,"q":"Which statement correctly describes L-attributed translation as presented in the notes?","options":{"A":"It uses synthesized attributes and restricts rules to the beginning","B":"It uses synthesized and inherited attributes and allows rules at different positions","C":"It uses inherited attributes and restricts rules to the end","D":"It uses synthesized attributes and excludes inherited values"},"correct":"B","source":"Notes 2.pdf, p. 14"},{"id":"CC-150","number":150,"local":10,"group":"topic-14","topic":"Syntax-directed definitions and translations","page":34,"q":"Which statement correctly describes S-attributed translation?","options":{"A":"It uses inherited attributes with actions at the beginning","B":"It uses synthesized attributes with actions at the end","C":"It uses both attribute types with actions at any position","D":"It uses inherited attributes with actions at any position"},"correct":"B","source":"Notes 2.pdf, p. 14"},{"id":"CC-151","number":151,"local":1,"group":"topic-15","topic":"Storage organization, allocation and type checking","page":35,"q":"Which runtime-storage region is used to keep track of procedure activations and local data?","options":{"A":"Static data area","B":"Procedure stack","C":"Dynamic memory heap","D":"Target code area"},"correct":"B","source":"Notes 2.pdf, p. 19"},{"id":"CC-152","number":152,"local":2,"group":"topic-15","topic":"Storage organization, allocation and type checking","page":35,"q":"Which statement correctly describes static memory allocation?","options":{"A":"Memory is requested and released during program execution","B":"Memory is allocated when functions are called and returned","C":"Memory is assigned to processor registers during execution","D":"Memory locations are assigned at compile time and remain fixed"},"correct":"D","source":"Notes 2.pdf, p. 19"},{"id":"CC-153","number":153,"local":3,"group":"topic-15","topic":"Storage organization, allocation and type checking","page":35,"q":"Which statement best describes heap allocation?","options":{"A":"Memory is requested and released dynamically during execution","B":"Memory is assigned permanently to variables at compile time","C":"Memory is managed through function calls and stack returns","D":"Memory is assigned to variables using processor registers"},"correct":"A","source":"Notes 2.pdf, p. 19"},{"id":"CC-154","number":154,"local":4,"group":"topic-15","topic":"Storage organization, allocation and type checking","page":35,"q":"Which memory-management principle is followed by stack allocation?","options":{"A":"First-in, first-out (FIFO)","B":"Fixed-address allocation","C":"Last-in, first-out (LIFO)","D":"Dynamic heap allocation"},"correct":"C","source":"Notes 2.pdf, p. 19"},{"id":"CC-155","number":155,"local":5,"group":"topic-15","topic":"Storage organization, allocation and type checking","page":35,"q":"According to the notes, which storage locations provide the fastest access to data?","options":{"A":"Processor registers","B":"Runtime heap memory","C":"Procedure call stack","D":"Static data objects"},"correct":"A", ","number":160,"local":2,"group":"topic-16","topic":"Code optimization techniques","page":37,"q":"What is constant folding in compiler optimization?","options":{"A":"Evaluating constant-valued expressions during compilation","B":"Replacing variables with their assigned constant values","C":"Eliminating expressions that have already been evaluated","D":"Moving repeated statements outside program loops"},"correct":"A","source":"Notes 2.pdf, p. 20"},{"id":"CC-161","number":161,"local":3,"group":"topic-16","topic":"Code optimization techniques","page":37,"q":"Which statement best describes constant propagation?","options":{"A":"Replacing later uses of a variable with its assigned constant value","B":"Evaluating arithmetic expressions containing constant operands","C":"Removing code that cannot affect the program's execution","D":"Moving computations from inside loops to outside loops"},"correct":"A","source":"Notes 2.pdf, p. 20"},{"id":"CC-162","number":162,"local":4,"group":"topic-16","topic":"Code optimization techniques","page":37,"q":"Which transformation demonstrates common subexpression elimination?","options":{"A":"Moving an expression from inside a loop to before the loop","B":"Replacing multiplication by two with addition of a value","C":"Reusing a previously computed result instead of recalculating it","D":"Removing a conditional block that cannot be executed"},"correct":"C","source":"Notes 2.pdf, p. 20"},{"id":"CC-163","number":163,"local":5,"group":"topic-16","topic":"Code optimization techniques","page":37,"q":"Which transformation illustrates code movement in the notes?","options":{"A":"Replacing assigned variables with their constant values","B":"Removing a conditional block that cannot be executed","C":"Replacing a multiplication with an equivalent addition","D":"Moving x=y+z from inside a loop to before the loop"},"correct":"D","source":"Notes 2.pdf, p. 20"},{"id":"CC-164","number":164,"local":6,"group":"topic-16","topic":"Code optimization techniques","page":37,"q":"In the optimization example i=0; if (i==1) { a=x+5; }, the unreachable conditional block is removed. Which technique is illustrated?","options":{"A":"Constant propagation","B":"Dead code elimination","C":"Strength reduction","D":"Code movement"},"correct":"B","source":"Notes 2.pdf, p. 21"},{"id":"CC-165","number":165,"local":7,"group":"topic-16","topic":"Code optimization techniques","page":38,"q":"Which transformation is an example of strength reduction according to the notes?","options":{"A":"Replacing S3 = 4*i with S3 = S1","B":"Replacing the variable pi with 3.14","C":"Replacing B = A*2 with B = A+A","D":"Moving x = y+z outside a program loop"},"correct":"C","source":"Notes 2.pdf, p. 21"},{"id":"CC-166","number":166,"local":8,"group":"topic-16","topic":"Code optimization techniques","page":38,"q":"Which two optimization techniques are classified under compile-time evaluation in the notes?","options":{"A":"Code movement and dead code elimination","B":"Strength reduction and code movement","C":"Dead code elimination and constant propagation","D":"Constant folding and constant propagation"},"correct":"D","source":"Notes 2.pdf, p. 20"},{"id":"CC-167","number":167,"local":9,"group":"topic-16","topic":"Code optimization techniques","page":38,"q":"Which comparison correctly distinguishes code movement from common subexpression elimination?","options":{"A":"Code movement relocates statements; common subexpression elimination avoids repeated calculations","B":"Code movement replaces constants; common subexpression elimination removes unreachable statements","C":"Code movement replaces multiplication; common subexpression elimination checks operand types","D":"Code movement constructs parse trees; common subexpression elimination identifies lexical tokens"},"correct":"A","source":"Notes 2.pdf, pp. 20-21"},{"id":"CC-168","number":168,"local":1,"group":"topic-17","topic":"Three-pass compilers and parameter passing","page":38,"q":"What is the output of the second pass (syntax analysis) in the three-pass compiler described in the notes?","options":{"A":"A stream of recognized lexical tokens","B":"A parse tree or abstract syntax tree","C":"The final optimized machine code","D":"A list of processor register allocations"},"correct":"B","source":"Notes 2.pdf, p. 21"},{"id":"CC-169","number":169,"local":2,"group":"topic-17","topic":"Three-pass compilers and parameter passing","page":39,"q":"What is the output of the third pass, which performs semantic analysis and code generation?","options":{"A":"A sequence of lexical tokens","B":"A set of grammar production rules","C":"The final optimized machine code","D":"A collection of parsing-table entries"},"correct":"C","source":"Notes 2.pdf, p. 22"},{"id":"CC-170","number":170,"local":3,"group":"topic-17","topic":"Three-pass compilers and parameter passing","page":39,"q":"What is an l-value according to the parameter-passing notes?","options":{"A":"The constant assigned to a variable during compilation","B":"The value obtained by evaluating a program expression","C":"The value provided to a procedure as an argument","D":"The memory location or address where an expression is stored"},"correct":"D","source":"Notes 2.pdf, p. 22"},{"id":"CC-171","number":171,"local":4,"group":"topic-17","topic":"Three-pass compilers and parameter passing","page":39,"q":"Which statement correctly distinguishes formal parameters from actual parameters?","options":{"A":"Formal parameters are specified in calls; actual parameters are declared in definitions","B":"Formal parameters contain memory addresses; actual parameters contain constant expressions","C":"Formal parameters receive data in called functions; actual parameters are supplied in calls","D":"Formal parameters specify return values; actual parameters specify local storage locations"},"correct":"C","source":"Notes 2.pdf, p. 22"},{"id":"CC-172","number":172,"local":5,"group":"topic-17","topic":"Three-pass compilers and parameter passing","page":39, t":17,"first":168,"last":175}],"slug":"compiler-construction-175","shortTitle":"Compiler Construction · 175 MCQs","homeTitle":"175 questions. One focused study plan.","file":"Compiler_Construction_175_MCQs.pdf"}</script>
<script>(() => {
  'use strict';
  const BANK = JSON.parse(document.getElementById('quiz-dataset').textContent);
  const Q = BANK.questions;
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  const KEY = 'compiler-construction-quiz-v1-' + BANK.slug;
  const letters = ['A','B','C','D'];
  const root = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = (a,b) => b ? Math.round(a * 1000 / b) / 10 : 0;
  let canSave = false;
  try { localStorage.setItem(KEY+'-test','1'); canSave=localStorage.getItem(KEY+'-test')==='1';localStorage.removeItem(KEY+'-test'); } catch(e) {}
  let state = {session:null,latest:{}};
  try { const stored=localStorage.getItem(KEY);if(stored){const v=JSON.parse(stored);if(v && typeof v==='object')state={session:v.session||null,latest:v.latest||{}};} }catch(e){}
  if(state.session && (!Array.isArray(state.session.ids)||!state.session.ids.length||!state.session.ids.every(id=>byId[id])||!state.session.responses))state.session=null;
  let theme='light';
  try{theme=localStorage.getItem(KEY+'-theme')||'light';}catch(e){}
  if(theme!=='dark')theme='light';
  document.documentElement.dataset.theme=theme;
  let view='home';
  const save = () => {try{if(canSave)localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} };
  const scrollTop = () => window.scrollTo({top:0,behavior:'instant'});
  const stats = () => {
    const s=state.session;if(!s)return null;
    let done=0,correct=0;
    for(const id of s.ids)if(s.responses[id]){done++;if(s.responses[id]===byId[id].correct)correct++;}
    return {total:s.ids.length,done,left:s.ids.length-done,correct,wrong:done-correct,accuracy:pct(correct,done),completion:pct(done,s.ids.length)};
  };
  const nav = () => `<header class="topbar"><div class="container inner"><button class="brand" data-action="home" aria-label="Return to home"><span class="logo">CC</span><span class="brand-text"><strong>${esc(BANK.shortTitle)}</strong><small>Interactive question bank</small></span></button><div class="top-actions"><button class="header-btn" data-action="home">Home</button><button class="header-btn" data-action="theme">${theme==='dark'?'Light mode':'Dark mode'}</button></div></div></header>`;
  const footer = () => `<footer class="footer container">Questions, answer keys, and study references are reproduced from ${esc(BANK.file)}. Works without internet. ${canSave?'Your progress is saved in this browser.':'Browser saving is unavailable; progress lasts only while this tab remains open.'}</footer>`;
  const launchCard = (action,ic,title,desc,call,disabled=false) => `<button class="launch-card" data-action="${action}" ${disabled?'disabled':''}><span class="launch-icon" aria-hidden="true">${ic}</span><strong>${esc(title)}</strong><span class="desc">${esc(desc)}</span><span class="launch-link">${esc(call)} →</span></button>`;
  function home(){
    const s=state.session,st=stats();
    const missed=Q.filter(q=>state.latest[q.id] && state.latest[q.id]!==q.correct).length;
    const topics=BANK.topics.map((g,i)=>{const n=Q.filter(q=>q.group===g.id).length;return `<button class="topic-card" data-action="topic" data-id="${esc(g.id)}"><span class="topic-no">${i+1}</span><span class="topic-name">${esc(g.title)}</span><span class="count">${n} Qs</span></button>`;}).join('');
    return `<main class="container">
      <section class="hero"><div class="hero-banner"><div class="eyebrow">Compiler Construction · Study and examination</div><h1>${esc(BANK.homeTitle)}</h1><p>Practice directly from your PDF, revise individual topics, or take a 50-question mock exam. Every question retains its original answer choices and study reference.</p></div>
      <div class="metrics"><div class="metric"><b>${Q.length}</b><small>Questions from PDF</small></div><div class="metric"><b>${BANK.topics.length}</b><small>Study topics</small></div><div class="metric"><b>${missed}</b><small>Questions to revisit</small></div></div></section>
      ${s&&st?`<section class="resume"><div><strong>${s.submitted?'Last attempt':'Continue'}: ${esc(s.label)}</strong><p>${st.done} / ${st.total} answered ${s.mode==='exam'&&!s.submitted?'· Exam answers hidden until submission':`· ${st.correct} correct`} ${s.submitted?'· Submitted':'· In progress'}</p></div><button class="btn primary" data-action="resume">${s.submitted?'Review results':'Resume test'} →</button></section>`:''}
      <section><div class="section-heading"><h2>Choose your test</h2><p>Practice or exam mode</p></div><div class="launch-grid">
      ${launchCard('all','≡','Study all 175','All questions in the exact sequence from the PDF. Immediate answer feedback.','Start practice')}
      ${launchCard('mixed','⇄','Shuffle all 175','Answer all questions in random order, with immediate explanations of the correct choice.','Start mixed practice')}
      ${launchCard('exam','◷','Mock exam · 50 questions','A random selection of 50 questions. Change answers before submitting; the answer key stays hidden.','Start mock exam')}
      ${launchCard('missed','↺','Retry missed questions',missed?`Go back to ${missed} question${missed===1?'':'s'} you last missed.`:'Your incorrect questions will appear here as you practice.',missed?'Start revision':'No mistakes yet',!missed)}</div></section>
      <section id="topics"><div class="section-heading"><h2>Practice by topic</h2><p>17 sections from your PDF</p></div><div class="topic-grid">${topics}</div></section>
      <div class="note">Study mode shows the correct choice after each answer. Exam mode hides all answers until you press Submit exam. You can skip questions and use the navigator. <button class="text-link" data-action="reset">Delete saved progress</button></div>
    </main>`;
  }
  function hud(s,st){
    const exam=s.mode==='exam'&&!s.submitted;
    return `<section class="status-shell"><div class="status-heading"><div><div class="small-label">${exam?'Mock examination':'Current practice'}</div><strong>${esc(s.label)}</strong></div>${exam?'<button class="btn primary" data-action="submit" style="min-height:39px;padding:9px 13px;font-size:12px">Submit exam</button>':'<button class="btn soft" data-action="results" style="min-height:39px;padding:9px 12px;font-size:12px">View results</button>'}</div>
      <div class="score-grid"><div class="score-cell"><b>${st.done}</b><span>Answered</span></div><div class="score-cell"><b>${st.left}</b><span>Remaining</span></div><div class="score-cell ${exam?'':'correct'}"><b>${exam?'—':st.correct}</b><span>Correct</span></div><div class="score-cell"><b>${exam?`${st.completion}%`:`${st.accuracy}%`}</b><span>${exam?'Completed':'Accuracy'}</span></div></div>
      <div class="progress-track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${st.total}" aria-valuenow="${st.done}"><div class="progress-fill" style="width:${st.completion}%"></div></div><div class="progress-caption"><span>${st.done} of ${st.total} answered</span><span>${exam?'Answers hidden until submission':`${st.completion}% complete · ${st.wrong} incorrect`}</span></div></section>`;
  }
  function quiz(){
    const s=state.session;if(!s)return home();
    const st=stats(),q=byId[s.ids[s.index]],chosen=s.responses[q.id];
    const locked=s.mode==='practice'||s.submitted;
    const reveal=Boolean(chosen) && (s.mode==='practice'||s.submitted);
    const correct=Boolean(chosen)&&chosen===q.correct;
    const options=letters.map(letter=>{
      let cls='';if(reveal)cls=letter===q.correct?'was-correct':letter===chosen?'was-wrong':'';
      else if(letter===chosen)cls='was-selected';
      const mark=reveal?(letter===q.correct?'✓':letter===chosen?'×':''):'';
      return `<button type="button" class="answer ${cls}" data-action="answer" data-value="${letter}" ${(locked&&chosen)||s.submitted?'disabled':''} aria-pressed="${letter===chosen?'true':'false'}"><span class="letter">${letter}</span><span class="option-text">${esc(q.options[letter])}</span>${mark?`<span class="mark" aria-hidden="true">${mark}</span>`:''}</button>`;
    }).join('');
    const feedback=reveal?`<div class="feedback ${correct?'good':'bad'}" id="feedback" role="status"><strong>${correct?'✓ Correct answer!':'× Correct answer'}</strong><p><b>${q.correct}.</b> ${esc(q.options[q.correct])}</p><div class="source-ref">Source: ${esc(q.source)} · Question bank PDF page ${q.page}</div></div>`:'';
    const navigator=s.ids.map((id,i)=>{const a=s.responses[id],fq=byId[id];const cls=(s.mode==='exam'&&!s.submitted)?(a?'answered':''):a?(a===fq.correct?'good':'bad'):'';return `<button type="button" class="nav-number ${cls} ${i===s.index?'current':''}" title="Question ${i+1}${a?' · Answered':' · Unanswered'}" data-action="jump" data-index="${i}" ${i===s.index?'aria-current="step"':''}>${i+1}</button>`;}).join('');
    let nextLabel=s.index===s.ids.length-1?(s.mode==='exam'&&!s.submitted?'Review unanswered →':st.left===0?'See results →':'Next unanswered →'):'Next →';
    return `<main class="container quiz-wrap">${hud(s,st)}<article class="question-card"><div class="question-top"><span class="tag">${esc(q.topic)}</span><span class="tag muted">Original Q${q.number}</span><span class="tag muted">PDF p. ${q.page}</span>${s.mode==='exam'&&!s.submitted?'<span class="tag exam-tag">Exam mode</span>':''}</div><p class="question-label">Question ${s.index+1} of ${s.ids.length}</p><h1 class="question-title">${esc(q.q)}</h1><div class="answer-list" role="group" aria-label="Answer choices">${options}</div>${feedback}${s.mode==='exam'&&!s.submitted?'<div class="foot-tip">Answers are not marked until you submit. You may change a selection or skip any question.</div>':''}<div class="question-actions"><button class="btn" data-action="prev" ${s.index===0?'disabled':''}>← Previous</button><div class="right-controls">${!chosen?'<button class="btn" data-action="skip">Skip</button>':''}<button class="btn primary" data-action="next">${nextLabel}</button></div></div></article><details class="navigator"><summary>Jump to any question <small>· ${s.mode==='exam'&&!s.submitted?'blue = answered':'green = correct · red = incorrect'}</small></summary><div class="nav-grid">${navigator}</div></details><div class="foot-tip">Keyboard shortcuts: A–D or 1–4 to select, ← / → to navigate. ${s.mode==='practice'?'Practice answers are locked after selection.':''}</div></main>`;
  }
  function results(){
    const s=state.session;if(!s)return home();if(s.mode==='exam'&&!s.submitted){view='quiz';return quiz();}
    const st=stats(),missed=s.ids.filter(id=>s.responses[id] && s.responses[id]!==byId[id].correct),unanswered=s.ids.filter(id=>!s.responses[id]);
    const groups=[...new Set(s.ids.map(id=>byId[id].group))].map(gid=>{
      const list=s.ids.filter(id=>byId[id].group===gid),ok=list.filter(id=>s.responses[id]===byId[id].correct).length,done=list.filter(id=>s.responses[id]).length;
      return `<div class="breakdown-row"><div class="breakdown-line"><strong>${esc(list[0].topic)}</strong><span>${ok} / ${list.length} correct</span></div><div class="mini-track"><span style="width:${pct(ok,list.length)}%"></span></div><div class="small-label" style="margin-top:5px">${done} attempted · ${list.length-done} unanswered</div></div>`;
    }).join('');
    const mistakes=missed.map(id=>{const q=byId[id],choice=s.responses[id];return `<div class="mistake"><strong>Q${q.number}. ${esc(q.q)}</strong><p class="wrong">Your answer: ${choice}. ${esc(q.options[choice])}</p><p class="right">Correct: ${q.correct}. ${esc(q.options[q.correct])}</p><p class="source-ref">${esc(q.source)} · Bank PDF page ${q.page}</p><button class="text-link" data-action="review" data-id="${esc(id)}">Review this question</button></div>`;}).join('');
    return `<main class="container results"><div class="result-hero"><div class="ring" style="--score:${st.accuracy}%"><div class="inner"><strong>${st.accuracy}%</strong><span>accuracy</span></div></div><div class="intro"><div class="eyebrow" style="color:var(--blue)">${s.mode==='exam'?'Mock exam result':st.left?'Practice in progress':'Practice complete'}</div><h1>${s.mode==='exam'?'Your exam results':st.left?'Your practice progress':'Practice completed'}</h1><p>${st.correct} correct · ${st.wrong} incorrect · ${st.left} unanswered. Accuracy is calculated from the ${st.done} questions answered.</p></div></div>
      <div class="metrics"><div class="metric"><b>${st.correct}</b><small>Correct</small></div><div class="metric"><b>${st.wrong}</b><small>Incorrect</small></div><div class="metric"><b>${st.left}</b><small>Unanswered</small></div></div>
      <div class="section-heading"><h2>What would you like to do?</h2></div><div class="btn-row">${s.mode==='practice'&&st.left?'<button class="btn primary" data-action="resume">Continue practice →</button>':''}${missed.length?`<button class="btn ${st.left?'':'primary'}" data-action="retrywrong">Retry ${missed.length} mistakes</button>`:''}<button class="btn" data-action="reviewall">Review all questions</button><button class="btn" data-action="export">Download results CSV</button><button class="btn" data-action="restart">Restart this test</button><button class="btn" data-action="home">All topics</button></div>
      <div class="section-heading"><h2>Performance by topic</h2><p>${st.done} of ${st.total} attempted</p></div><div class="breakdown">${groups}</div>
      <div class="section-heading"><h2>Answer review</h2><p>Focus on weak areas</p></div><div class="breakdown">${missed.length?`<details><summary class="review-summary">${missed.length} incorrect answers · Show details</summary>${mistakes}</details>`:'<p class="empty">No incorrect answers in this attempt.</p>'}${unanswered.length?`<p class="empty">${unanswered.length} question${unanswered.length===1?' was':'s were'} left unanswered.</p>`:''}</div>
    </main>`;
  }
  function render(){root.innerHTML=nav()+(view==='quiz'?quiz():view==='results'?results():home())+footer();}
  function shuffle(ids){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return ids;}
  function start(ids,label,mode='practice',force=false){
    if(!ids.length)return;
    const old=state.session;
    if(!force && old && !old.submitted && Object.keys(old.responses).length && !confirm('Start a new test? This will replace your current session.'))return;
    state.session={ids:[...ids],originIds:[...ids],label,mode,index:0,responses:{},submitted:false,startedAt:Date.now()};
    save();view='quiz';render();scrollTop();
  }
  function nextUnanswered(from){const s=state.session,n=s.ids.length;for(let x=1;x<=n;x++){const i=(from+x)%n;if(!s.responses[s.ids[i]])return i;}return null;}
  function next(){const s=state.session;if(!s)return;const st=stats();if(s.mode==='practice'&&st.left===0){view='results';render();scrollTop();return;}if(s.submitted){if(s.index+1<s.ids.length)s.index++;else{view='results';render();scrollTop();return;}}
    else if(s.index+1<s.ids.length)s.index++;else{const i=nextUnanswered(s.index);if(i==null){if(s.mode==='exam'){submit();return;}view='results';render();scrollTop();return;}s.index=i;}
    save();render();scrollTop();
  }
  function skip(){const s=state.session;if(!s)return;const i=nextUnanswered(s.index);if(i!==null&&i!==s.index){s.index=i;save();render();scrollTop();}}
  function answer(letter){const s=state.session;if(!s||view!=='quiz'||s.submitted||!letters.includes(letter))return;const q=byId[s.ids[s.index]];
    if(s.mode==='practice'&&s.responses[q.id])return;
    s.responses[q.id]=letter;
    if(s.mode==='practice')state.latest[q.id]=letter;
    save();render();
    if(s.mode==='practice'){const el=document.getElementById('feedback');if(el&&el.getBoundingClientRect().bottom>window.innerHeight-10)el.scrollIntoView({block:'nearest',behavior:'smooth'});}
  }
  function submit(){const s=state.session;if(!s||s.mode!=='exam'||s.submitted)return;const st=stats();if(!confirm(st.left?`Submit exam with ${st.left} unanswered question${st.left===1?'':'s'}? Answers will be locked.`:'Submit exam and reveal your score? Answers will be locked.'))return;
    s.submitted=true;s.submittedAt=Date.now();for(const id of s.ids)if(s.responses[id])state.latest[id]=s.responses[id];save();view='results';render();scrollTop();
  }
  function exportCsv(){const s=state.session;if(!s||(s.mode==='exam'&&!s.submitted))return;
    const rows=[['Test order','Original number','Topic','Question','Your answer','Correct answer','Result','Source','Bank PDF page']];
    s.ids.forEach((id,i)=>{const q=byId[id],v=s.responses[id];rows.push([i+1,q.number,q.topic,q.q,v?`${v}. ${q.options[v]}`:'Unanswered',`${q.correct}. ${q.options[q.correct]}`,v?(v===q.correct?'Correct':'Incorrect'):'Unanswered',q.source,q.page]);});
    const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=BANK.slug+'-'+s.mode+'-results.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  root.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action;
    if(action==='home'){view='home';render();scrollTop();return;}
    if(action==='theme'){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem(KEY+'-theme',theme);}catch(e){}render();return;}
    if(action==='all'){start(Q.map(q=>q.id),'All 175 questions');return;}
    if(action==='mixed'){start(shuffle(Q.map(q=>q.id)),'Shuffled 175-question practice');return;}
    if(action==='exam'){start(shuffle(Q.map(q=>q.id)).slice(0,50),'50-question mock exam','exam');return;}
    if(action==='topic'){const t=BANK.topics.find(t=>t.id===btn.dataset.id);if(t)start(Q.filter(q=>q.group===t.id).map(q=>q.id),t.title);return;}
    if(action==='missed'){const ids=Q.filter(q=>state.latest[q.id]&&state.latest[q.id]!==q.correct).map(q=>q.id);if(ids.length)start(ids,'Review missed questions');return;}
    if(action==='resume'){if(state.session){view=state.session.submitted?'results':'quiz';render();scrollTop();}return;}
    if(action==='answer'){answer(btn.dataset.value);return;}
    if(action==='prev'){const s=state.session;if(s&&s.index>0){s.index--;save();render();scrollTop();}return;}
    if(action==='next'){next();return;}
    if(action==='skip'){skip();return;}
    if(action==='jump'){const s=state.session,i=Number(btn.dataset.index);if(s&&Number.isInteger(i)&&i>=0&&i<s.ids.length){s.index=i;save();render();scrollTop();}return;}
    if(action==='submit'){submit();return;}
    if(action==='results'){if(state.session&&state.session.mode==='exam'&&!state.session.submitted)return;view='results';render();scrollTop();return;}
    if(action==='reviewall'){if(state.session){state.session.index=0;view='quiz';render();scrollTop();}return;}
    if(action==='review'){const s=state.session;if(!s)return;const i=s.ids.indexOf(btn.dataset.id);if(i!==-1){s.index=i;view='quiz';save();render();scrollTop();}return;}
    if(action==='retrywrong'){const s=state.session;if(s){const ids=s.ids.filter(id=>s.responses[id]&&s.responses[id]!==byId[id].correct);if(ids.length)start(ids,'Practice previous mistakes','practice',true);}return;}
    if(action==='restart'){const s=state.session;if(s&&confirm('Restart this test and discard its answers?'))start(s.originIds||s.ids,s.label,s.mode,true);return;}
    if(action==='export'){exportCsv();return;}
    if(action==='reset'){if(confirm('Delete all saved progress for Compiler Construction quizzes?')){state={session:null,latest:{}};save();view='home';render();scrollTop();}return;}
  });
  document.addEventListener('keydown',e=>{if(view!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.closest('button,input,textarea,select,summary'))return;
    const v=e.key.toUpperCase();const l=/^[1-4]$/.test(v)?letters[Number(v)-1]:(letters.includes(v)?v:null);if(l){answer(l);return;}
    if(e.key==='ArrowRight'){e.preventDefault();next();}
    if(e.key==='ArrowLeft'&&state.session?.index>0){e.preventDefault();state.session.index--;save();render();scrollTop();}
  });
  render();
})();
</script>
</body></html>
