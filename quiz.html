<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Questions Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .score {
            position: sticky;
            top: 10px;
            z-index: 10;
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .question {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: block;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #f1f3f5;
        }

        .option input {
            margin-right: 10px;
        }

        .correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }

        .wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        .result {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }

        .result.correct-result {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .result.wrong-result {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .option.disabled {
            cursor: default;
        }

        .reset-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #444;
        }
    </style>
</head>

let score = 0;
let answered = new Array(questions.length).fill(false);

function loadQuiz() {

    const quiz = document.getElementById("quiz");
    quiz.innerHTML = "";

    questions.forEach((q, questionIndex) => {

        const questionDiv = document.createElement("div");
        questionDiv.className = "question";

        const questionText = document.createElement("div");
        questionText.className = "question-text";
        questionText.textContent =
            (questionIndex + 1) + ". " + q.question;

        questionDiv.appendChild(questionText);

        q.options.forEach((option, optionIndex) => {

            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "question-" + questionIndex;
            input.value = optionIndex;

            input.addEventListener("change", function () {
                checkAnswer(
                    questionIndex,
                    optionIndex,
                    questionDiv
                );
            });

            label.appendChild(input);
            label.appendChild(
                document.createTextNode(
                    String.fromCharCode(65 + optionIndex) +
                    ". " +
                    option
                )
            );

            questionDiv.appendChild(label);
        });

        const result = document.createElement("div");
        result.className = "result";
        result.id = "result-" + questionIndex;

        questionDiv.appendChild(result);

        quiz.appendChild(questionDiv);
    });
}

function checkAnswer(questionIndex, selectedIndex, questionDiv) {

    if (answered[questionIndex]) {
        return;
    }

    answered[questionIndex] = true;

    const question = questions[questionIndex];
    const options = questionDiv.querySelectorAll(".option");
    const result = document.getElementById("result-" + questionIndex);

    options.forEach((option, index) => {

        option.classList.add("disabled");

        const input = option.querySelector("input");
        input.disabled = true;

        if (index === question.answer) {
            option.classList.add("correct");
        }
    });

    if (selectedIndex === question.answer) {

        score++;

        result.textContent = "Correct!";
        result.className = "result correct-result";

    } else {

        options[selectedIndex].classList.add("wrong");

        const correctLetter =
            String.fromCharCode(65 + question.answer);

        result.textContent =
            "Wrong! Correct answer: " +
            correctLetter +
            ". " +
            question.options[question.answer];

        result.className = "result wrong-result";
    }

    document.getElementById("score").textContent = score;
}

function resetQuiz() {

    score = 0;
    answered = new Array(questions.length).fill(false);

    document.getElementById("score").textContent = "0";

    loadQuiz();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
