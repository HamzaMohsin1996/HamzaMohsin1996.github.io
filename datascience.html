<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Data Science MCQs Practice & Study</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --correct-bg: #dcfce7;
            --correct-border: #16a34a;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #dc2626;
            --option-hover: #f1f5f9;
            --tab-inactive: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
        }

        /* Tabs Styling */
        .tabs-header {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background-color: var(--tab-inactive);
            color: #475569;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Control Panel */
        .control-panel {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #475569;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            font-size: 0.95rem;
            color: var(--text-color);
            outline: none;
        }

        /* Quiz Layout */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .quiz-option:hover:not(.disabled) {
            background-color: var(--option-hover);
            border-color: #cbd5e1;
        }

        .option.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #14532d;
            font-weight: 600;
        }

        .option.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #7f1d1d;
        }

        .option.disabled {
            cursor: default;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        /* Study List Layout */
        .study-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            border-left: 5px solid var(--accent-color);
        }

        .study-item .topic-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .study-item .q-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .study-opts {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .study-opt {
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Header Navigation Tabs -->
    <div class="tabs-header">
        <button class="tab-btn active" onclick="switchMainTab('studyTab')">📖 Solved Study Mode</button>

                <button class="btn" id="prevBtn" onclick="prevQuestion()">Previous</button>

        </div>
    </div>

</div>

let quizFilteredData = [...quizData];
let currentQuizIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);

function initTopics() {
    const topics = [...new Set(quizData.map(q => q.topic))];
    const studySelect = document.getElementById("studyTopicSelect");
    const quizSelect = document.getElementById("quizTopicSelect");

    topics.forEach(t => {
        const opt1 = document.createElement("option");
        opt1.value = t;
        opt1.textContent = t;
        studySelect.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = t;
        opt2.textContent = t;
        quizSelect.appendChild(opt2);
    });
}

function switchMainTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabId === 'studyTab') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('studyTab').classList.add('active');
        renderStudyList();
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('quizTab').classList.add('active');
        renderQuizQuestion();
    }
}

/* --- SOLVED STUDY MODE LOGIC --- */
function renderStudyList() {
    const selectedTopic = document.getElementById("studyTopicSelect").value;
    const container = document.getElementById("studyListContainer");
    container.innerHTML = "";

    const filtered = selectedTopic === "all" ? quizData : quizData.filter(q => q.topic === selectedTopic);
    const letters = ["A", "B", "C", "D"];

    filtered.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "study-item";

        let optionsHtml = item.options.map((opt, idx) => {
            const isCorrect = idx === item.answer;
            const optClass = isCorrect ? "option correct" : "study-opt";
            return `<div class="${optClass}">${letters[idx]}) ${opt} ${isCorrect ? ' ✓' : ''}</div>`;
        }).join('');

        div.innerHTML = `
            <div class="topic-tag">${item.topic}</div>
            <div class="q-title">${index + 1}. ${item.q}</div>
            <div class="study-opts">${optionsHtml}</div>
        `;
        container.appendChild(div);
    });
}

/* --- INTERACTIVE QUIZ LOGIC --- */
function switchQuizTopic() {
    const selectedTopic = document.getElementById("quizTopicSelect").value;
    quizFilteredData = selectedTopic === "all" ? [...quizData] : quizData.filter(q => q.topic === selectedTopic);
    currentQuizIndex = 0;
    renderQuizQuestion();
}

function renderQuizQuestion() {
    const q = quizFilteredData[currentQuizIndex];
    const globalIndex = quizData.indexOf(q);

    document.getElementById("quizTopicLabel").textContent = q.topic;
    document.getElementById("quizProgressLabel").textContent = `Q ${currentQuizIndex + 1} / ${quizFilteredData.length}`;
    document.getElementById("quizQuestionText").textContent = `${currentQuizIndex + 1}. ${q.q}`;

    const container = document.getElementById("quizOptionsContainer");
    container.innerHTML = "";

    const letters = ["A", "B", "C", "D"];
    const userAns = userAnswers[globalIndex];

    q.options.forEach((opt, idx) => {
        const div = document.createElement("div");
        div.className = "option quiz-option";
        div.textContent = `${letters[idx]}) ${opt}`;

        if (userAns !== null) {
            div.classList.add("disabled");
            if (idx === q.answer) {
                div.classList.add("correct");
            } else if (idx === userAns) {
                div.classList.add("incorrect");
            }
        } else {
            div.onclick = () => selectQuizOption(globalIndex, idx);
        }

        container.appendChild(div);
    });

    document.getElementById("prevBtn").disabled = currentQuizIndex === 0;
    document.getElementById("nextBtn").disabled = currentQuizIndex === quizFilteredData.length - 1;
}

function selectQuizOption(globalIndex, optionIndex) {
    userAnswers[globalIndex] = optionIndex;
    renderQuizQuestion();
}

function prevQuestion() {
    if (currentQuizIndex > 0) {
        currentQuizIndex--;
        renderQuizQuestion();
    }
}

function nextQuestion() {
    if (currentQuizIndex < quizFilteredData.length - 1) {
        currentQuizIndex++;
        renderQuizQuestion();
    }
}

// Initial setup
initTopics();
renderStudyList();
</script>
