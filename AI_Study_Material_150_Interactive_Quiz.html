opic":"Types of Learning","page":31,"q":"According to the AI techniques slide, which mechanism guides the training of an agent in reinforcement learning?","options":{"A":"Labelled examples supplied by a supervisor","B":"Unlabelled examples grouped by similarity","C":"Rules extracted from domain experts","D":"Rewards and punishments received for decisions"},"correct":"D","source":"(Topic: Types of Learning | Source: introduction to AI.pptx, slide 7)","answer_text":"Rewards and punishments received for decisions"},{"id":"Q143","local":143,"group":"topic-12","topic":"Types of Learning","page":31,"q":"A machine is trained on examples containing known correct answers. It then analyses new examples to produce an outcome. Which learning approach does this describe?","options":{"A":"Unsupervised Learning","B":"Reinforcement Learning","C":"Episodic Learning","D":"Supervised Learning"},"correct":"D","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Supervised Learning"},{"id":"Q144","local":144,"group":"topic-12","topic":"Types of Learning","page":31,"q":"A machine receives unlabelled information and must discover hidden structure by itself. Which learning method is being used?","options":{"A":"Unsupervised Learning","B":"Supervised Learning","C":"Reinforcement Learning","D":"Observational Learning"},"correct":"A","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Unsupervised Learning"},{"id":"Q145","local":145,"group":"topic-12","topic":"Types of Learning","page":31,"q":"An intelligent agent improves its decisions by receiving rewards or penalties for its actions. Which learning method does this represent?","options":{"A":"Supervised Learning","B":"Unsupervised Learning","C":"Reinforcement Learning","D":"Episodic Learning"},"correct":"C","source":"(Topic: Types of Learning | Source: introduction to AI.pptx, slide 7)","answer_text":"Reinforcement Learning"},{"id":"Q146","local":146,"group":"topic-12","topic":"Types of Learning","page":31,"q":"What is a key difference between supervised and unsupervised learning according to the document?","options":{"A":"Supervised learning uses feedback, while unsupervised learning uses rewards.","B":"Supervised learning uses a teacher, while unsupervised learning has no teacher.","C":"Supervised learning groups unlabelled data, while unsupervised learning uses labels.","D":"Supervised learning uses observations, while unsupervised learning uses penalties."},"correct":"B","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Supervised learning uses a teacher, while unsupervised learning has no teacher."},{"id":"Q147","local":147,"group":"topic-12","topic":"Types of Learning","page":32,"q":"Which pair of examples is specifically associated with reinforcement learning in the uploaded document?","options":{"A":"Clinical expert systems and flight-tracking systems","B":"Handwriting recognition and character recognition","C":"Google Now and automatic voice output","D":"Self-driving cars and the AlphaGo algorithm"},"correct":"D","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Self-driving cars and the AlphaGo algorithm"},{"id":"Q148","local":148,"group":"topic-12","topic":"Types of Learning","page":32,"q":"How does a reinforcement-learning system evaluate and adjust its performance?","options":{"A":"By using feedback responses and reacting accordingly","B":"By relying on known labels provided during training","C":"By grouping examples according to hidden similarities","D":"By organizing domain information into expert rules"},"correct":"A","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"By using feedback responses and reacting accordingly"},{"id":"Q149","local":149,"group":"topic-12","topic":"Types of Learning","page":32,"q":"Which type of learning involves remembering sequences of events that have been witnessed or experienced?","options":{"A":"Auditory Learning","B":"Motor Learning","C":"Episodic Learning","D":"Observational Learning"},"correct":"C","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 3)","answer_text":"Episodic Learning"},{"id":"Q150","local":150,"group":"topic-12","topic":"Types of Learning","page":32,"q":"Which type of learning occurs when someone learns by watching and imitating others?","options":{"A":"Observational Learning","B":"Episodic Learning","C":"Auditory Learning","D":"Motor Learning"},"correct":"A","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 3)","answer_text":"Observational Learning"}],"topics":[{"id":"topic-1","title":"Uncertainty in Artificial Intelligence","sort":1},{"id":"topic-2","title":"Fuzzy Logic and Classical Set Theory","sort":2},{"id":"topic-3","title":"Constraint Satisfaction Problems (CSP)","sort":3},{"id":"topic-4","title":"Bayes' Theorem and Conditional Probability","sort":4},{"id":"topic-5","title":"Minimax and Alpha-Beta Pruning","sort":5},{"id":"topic-6","title":"Expert Systems and Knowledge Acquisition","sort":6},{"id":"topic-7","title":"Propositional Logic","sort":7},{"id":"topic-8","title":"Depth-First Search and Breadth-First Search","sort":8},{"id":"topic-9","title":"Informed and Uninformed Search","sort":9},{"id":"topic-10","title":"AI Foundations, History, Types, and Agents","sort":10},{"id":"topic-11","title":"AI Domains, Applications, Techniques, and Ethics","sort":11},{"id":"topic-12","title":"Types of Learning","sort":12}],"slug":"ai-study-150","shortTitle":"AI Study Material · 150 MCQs","homeTitle":"150 questions. One smarter way to study.","file":"AI_Study_Material_150_MCQs.pdf"}</script>
  <script>
  (() => {
    'use strict';
    const BANK = JSON.parse(document.getElementById('quiz-dataset').textContent);
    const Q = BANK.questions;
    const byId = Object.fromEntries(Q.map(q=>[q.id,q]));
    const KEY='ai-offline-quiz-v3-'+BANK.slug;
    const letters=['A','B','C','D'];
    const root=document.getElementById('app');
    let storeAvailable=false;
    try { const k=KEY+'-test'; localStorage.setItem(k,'ok');storeAvailable=localStorage.getItem(k)==='ok';localStorage.removeItem(k); }catch(e){}
    let state={session:null,latest:{}};
    try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved); if(parsed && typeof parsed==='object'){state.session=parsed.session||null;state.latest=parsed.latest||{};}}}catch(e){}
    if(state.session && (!Array.isArray(state.session.ids)||!state.session.ids.every(id=>byId[id])))state.session=null;
    let view='home';
    let theme='light';
    try{theme=localStorage.getItem(KEY+'-theme')||'light'}catch(e){}
    if(theme!=='dark')theme='light';
    document.documentElement.dataset.theme=theme;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const idAttr=s=>esc(s);
    const niceNum=n=>Number(n).toLocaleString('en-US');
    const pct=(a,b)=>b?Math.round(1000*a/b)/10:0;
    const sessionStats=()=>{const s=state.session;if(!s)return null;let done=0,correct=0;for(const id of s.ids){if(s.responses[id]){done++;if(s.responses[id]===byId[id].correct)correct++;}}return {total:s.ids.length,done,correct,wrong:done-correct,left:s.ids.length-done,accuracy:pct(correct,done),completion:pct(done,s.ids.length)};};
    function save(){try{if(storeAvailable)localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
    function nav(){return `<header class="topbar"><div class="container inner"><button class="brand" data-action="home" aria-label="Return to quiz home"><span class="logo">AI</span><span class="brand-text"><strong>${esc(BANK.shortTitle)}</strong><small>Interactive question bank</small></span></button><div class="top-actions"><button class="header-btn" data-action="home">Home</button><button class="header-btn" data-action="theme" aria-label="Toggle light or dark theme">${theme==='dark'?'Light mode':'Dark mode'}</button></div></div></header>`}
    const footer=()=>`<footer class="footer container">All questions and correct answers are taken from ${esc(BANK.file)}. Works offline in a browser. ${storeAvailable?'Your progress is saved in this browser.':'Saving is unavailable in this browser; keep this tab open to retain your session.'}</footer>`;
    function launchCard(action,icon,title,desc,link,disabled=false){return `<button class="launch-card" data-action="${action}" ${disabled?'disabled':''}><span class="launch-icon" aria-hidden="true">${icon}</span><strong>${title}</strong><span class="desc">${desc}</span><span class="launch-link">${link} →</span></button>`}
    function home(){
      const s=state.session,stats=sessionStats();
      const missed=Q.filter(q=>state.latest[q.id] && state.latest[q.id]!==q.correct).length;
      const topics=BANK.topics.map((g,i)=>{const num=Q.filter(q=>q.group===g.id).length;return `<button class="topic-card" data-action="topic" data-id="${idAttr(g.id)}"><span class="topic-no">${i+1}</span><span class="topic-name">${esc(g.title)}</span><span class="count">${num} Qs</span></button>`}).join('');
      return `<main class="container">
        <section class="hero"><div class="hero-banner"><div class="eyebrow">Artificial Intelligence · Practice & revise</div><h1>${esc(BANK.homeTitle)}</h1><p>Pick a topic or test the entire question bank. See the correct answer instantly, build your score, and practice the questions you missed.</p></div>
        <div class="metrics"><div class="metric"><b>${Q.length}</b><small>Total questions</small></div><div class="metric"><b>${BANK.topics.length}</b><small>Practice sections</small></div><div class="metric"><b>${missed}</b><small>Questions to revisit</small></div></div></section>
        ${s&&stats?`<section class="resume"><div><strong>Continue: ${esc(s.label)}</strong><p>${stats.done} of ${stats.total} answered · ${stats.correct} correct · ${stats.left} remaining</p></div><button class="btn primary" data-action="resume">Resume practice →</button></section>`:''}
        <section><div class="section-heading"><h2>Choose your practice</h2><p>Answers shown after you select</p></div><div class="launch-grid">${launchCard('all','≡','All questions','Go through every question in the original PDF order.',`Start ${Q.length} questions`)}${launchCard('mixed','⇄','Mixed practice','Shuffle the question order to test recall across different topics.','Start a mixed quiz')}${launchCard('missed','↺','Practice your mistakes',missed?`Repeat ${missed} question${missed===1?'':'s'} you last answered incorrectly.`:'Missed questions will appear here after you start practicing.',missed?`Review ${missed} missed`:'No missed questions yet',!missed)}${launchCard('topicintro','⌕','Topic-by-topic','Study one section at a time, using the same questions as the PDF.','Choose a section')}</div></section>
        <section id="topics"><div class="section-heading"><h2>Browse all sections</h2><p>Practice only what you need</p></div><div class="topic-grid">${topics}</div></section>
        <div class="note">Select an answer to receive immediate feedback. You can skip a question and return later using the question navigator. <button class="text-link" data-action="reset">Reset saved progress</button></div>
      </main>`;
    }
    function scoreHud(st,s){return `<section class="status-shell"><div class="status-heading"><div><div class="small-label">Current practice</div><strong>${esc(s.label)}</strong></div><button class="btn soft" data-action="results" style="min-height:39px;padding:9px 12px;font-size:12px">View results</button></div><div class="score-grid"><div class="score-cell"><b>${st.done}<span class="sr-only"> answered out of ${st.total}</span></b><span>Answered</span></div><div class="score-cell"><b>${st.left}</b><span>Left</span></div><div class="score-cell correct"><b>${st.correct}</b><span>Correct</span></div><div class="score-cell"><b>${st.accuracy}%</b><span>Accuracy</span></div></div><div class="progress-track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${st.total}" aria-valuenow="${st.done}"><div class="progress-fill" style="width:${st.completion}%"></div></div><div class="progress-caption"><span>${st.done} of ${st.total} answered</span><span>${st.completion}% complete · ${st.wrong} incorrect</span></div></section>`}
    function quiz(){
      const s=state.session;if(!s)return home();const st=sessionStats();const id=s.ids[s.index],q=byId[id],chosen=s.responses[id],answered=Boolean(chosen),right=answered&&chosen===q.correct;
      const options=letters.map(letter=>{const cl=answered&&letter===q.correct?'was-correct':answered&&letter===chosen?'was-wrong':''; const mark=answered&&letter===q.correct?'✓':answered&&letter===chosen?'×':'';return `<button type="button" class="answer ${cl}" data-action="answer" data-value="${letter}" ${answered?'disabled':''} aria-label="Option ${letter}: ${esc(q.options[letter])}"><span class="letter">${letter}</span><span class="option-text">${esc(q.options[letter])}</span>${mark?`<span class="mark" aria-hidden="true">${mark}</span>`:''}</button>`}).join('');
      const fb=answered?`<div class="feedback ${right?'good':'bad'}" id="feedback" role="status" aria-live="polite"><strong>${right?'✓ Correct answer!':'× Not quite — here is the correct answer'}</strong><p><b>${q.correct}.</b> ${esc(q.options[q.correct])}</p><div class="source-ref">PDF page ${q.page}${q.source?' · '+esc(q.source.replace(/^\(Topic:[^|]*\|\s*Source:\s*/, '').replace(/\)$/, '')):''}</div></div>`:'';
      const pager=s.ids.map((qid,i)=>{const a=s.responses[qid],code=a?(a===byId[qid].correct?'good':'bad'):'';return `<button class="nav-number ${code} ${i===s.index?'current':''}" title="Question ${i+1}${a?' — '+(a===byId[qid].correct?'Correct':'Incorrect'):' — Not answered'}" aria-label="Go to question ${i+1}" ${i===s.index?'aria-current="step"':''} data-action="jump" data-index="${i}">${i+1}</button>`}).join('');
      return `<main class="container quiz-wrap">${scoreHud(st,s)}<article class="question-card"><div class="question-top"><span class="tag">${esc(q.topic)}</span><span class="tag muted">PDF page ${q.page}</span></div><p class="question-label">Question ${s.index+1} of ${s.ids.length}</p><h1 class="question-title">${esc(q.q)}</h1><div class="answer-list" role="group" aria-label="Choose one answer">${options}</div>${fb}<div class="question-actions"><button class="btn" data-action="prev" ${s.index===0?'disabled':''}>← Previous</button><div class="right-controls">${!answered?'<button class="btn" data-action="skip">Skip</button>':''}<button class="btn primary" data-action="next" ${!answered&&st.left===1?'disabled':''}>${st.left===0?'See results →':'Next →'}</button></div></div></article><details class="navigator"><summary>Jump to a question <small>· green = correct, red = missed</small></summary><div class="nav-grid">${pager}</div></details><div class="foot-tip">Tip: Use keys 1–4 (or A–D) to answer, and ← / → to move between questions. Each answer is locked after selection to keep your score accurate.</div></main>`;
    }
    function results(){
      if(!state.session)return home();const s=state.session,st=sessionStats();const missed=s.ids.filter(id=>s.responses[id] && s.responses[id]!==byId[id].correct), unanswered=s.ids.filter(id=>!s.responses[id]);
      const groups=[...new Set(s.ids.map(id=>byId[id].group))].map(gid=>{const items=s.ids.filter(id=>byId[id].group===gid);const correct=items.filter(id=>s.responses[id]===byId[id].correct).length;const answered=items.filter(id=>s.responses[id]).length;return `<div class="breakdown-row"><div class="breakdown-line"><strong>${esc(items[0].topic)}</strong><span>${correct} / ${items.length} correct</span></div><div class="mini-track"><span style="width:${pct(correct,items.length)}%"></span></div><div class="small-label" style="margin-top:5px">${answered} answered · ${items.length-answered} left</div></div>`}).join('');
      const wronglist=missed.map(id=>{const q=byId[id],choice=s.responses[id];return `<div class="mistake"><strong>${esc(q.q)}</strong><p class="wrong">Your answer: ${choice}. ${esc(q.options[choice])}</p><p class="right">Correct: ${q.correct}. ${esc(q.options[q.correct])}</p><button class="text-link" data-action="review" data-id="${idAttr(id)}">View question</button></div>`}).join('');
      return `<main class="container results"><div class="result-hero"><div class="ring" style="--score:${st.accuracy}%"><div class="inner"><strong>${st.accuracy}%</strong><span>accuracy</span></div></div><div class="intro"><div class="eyebrow" style="color:var(--blue)">${st.left?'Your progress so far':'Practice complete'}</div><h1>${st.left?'Your quiz is in progress':'You completed the quiz!'}</h1><p>${st.correct} correct · ${st.wrong} incorrect · ${st.left} unanswered out of ${st.total} questions. ${st.left?'Continue answering whenever you like.':'Use the review below to strengthen weaker topics.'}</p></div></div>
        <div class="metrics"><div class="metric"><b>${st.correct}</b><small>Correct answers</small></div><div class="metric"><b>${st.wrong}</b><small>Incorrect answers</small></div><div class="metric"><b>${st.left}</b><small>Still to answer</small></div></div>
        <div class="section-heading"><h2>What next?</h2></div><div class="btn-row">${st.left?'<button class="btn primary" data-action="resume">Continue quiz →</button>':''}${missed.length?`<button class="btn ${st.left?'':'primary'}" data-action="retrywrong">Practice ${missed.length} incorrect →</button>`:''}<button class="btn" data-action="restart">Restart this practice</button><button class="btn" data-action="export">Download results CSV</button><button class="btn" data-action="home">All topics</button></div>
        <div class="section-heading"><h2>Performance by section</h2><p>${st.done} of ${st.total} attempted</p></div><div class="breakdown">${groups}</div>
        <div class="section-heading"><h2>Review your answers</h2><p>Learn from mistakes</p></div><div class="breakdown">${missed.length?`<details><summary style="cursor:pointer;font-weight:800;padding:4px 0 10px">${missed.length} incorrect answer${missed.length===1?'':'s'} — show details</summary>${wronglist}</details>`:'<p class="empty">No incorrect answers in this session.</p>'}${unanswered.length?`<p class="empty">${unanswered.length} questions are still unanswered. Continue your quiz to attempt them.</p>`:''}</div></main>`;
    }
    function render(){root.innerHTML=nav()+(view==='quiz'?quiz():view==='results'?results():home())+footer();}
    function start(ids,label){if(!ids.length)return;state.session={ids:[...ids],originIds:[...ids],label,responses:{},index:0,startedAt:Date.now()};save();view='quiz';render();window.scrollTo({top:0,behavior:'instant'});}
    function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
    function closestNextUnanswered(from){const s=state.session,n=s.ids.length;for(let offset=1;offset<=n;offset++){let i=(from+offset)%n;if(!s.responses[s.ids[i]])return i;}return null;}
    function next(){const s=state.session;if(!s)return;const st=sessionStats();if(st.left===0){view='results';render();scrollTop();return;}if(s.index+1<s.ids.length){s.index++;}else{const pos=closestNextUnanswered(s.index);if(pos!=null)s.index=pos;}save();render();scrollTop();}
    function skip(){const s=state.session;if(!s)return;const pos=closestNextUnanswered(s.index);if(pos!=null){s.index=pos;save();render();scrollTop();}}
    function onAnswer(letter){const s=state.session;if(!s||view!=='quiz')return;const id=s.ids[s.index],q=byId[id];if(s.responses[id]||!letters.includes(letter))return;s.responses[id]=letter;state.latest[id]=letter;save();render();const el=document.getElementById('feedback');if(el){const r=el.getBoundingClientRect();if(r.bottom>window.innerHeight-12)el.scrollIntoView({block:'nearest',behavior:'smooth'});}}
    function exportCSV(){const s=state.session;if(!s)return;const rows=[['No','Section','Question','Your answer','Correct answer','Result','PDF page']];s.ids.forEach((id,i)=>{const q=byId[id],selected=s.responses[id];rows.push([i+1,q.topic,q.q,selected?`${selected}. ${q.options[selected]}`:'Not answered',`${q.correct}. ${q.options[q.correct]}`,selected?(selected===q.correct?'Correct':'Incorrect'):'Not answered',q.page]);});const csv='\ufeff'+rows.map(row=>row.map(val=>'"'+String(val).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=BANK.slug+'_results.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    root.addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const ac=btn.dataset.action;
      if(ac==='home'){view='home';render();scrollTop();return;}
      if(ac==='theme'){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem(KEY+'-theme',theme)}catch(e){}render();return;}
      if(ac==='topicintro'){document.getElementById('topics')?.scrollIntoView({block:'start',behavior:'smooth'});return;}
      if(ac==='all'){start(Q.map(q=>q.id),'All questions');return;}
      if(ac==='mixed'){const ids=Q.map(q=>q.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}start(ids,'Mixed practice');return;}
      if(ac==='topic'){const g=BANK.topics.find(x=>x.id===btn.dataset.id);if(g)start(Q.filter(q=>q.group===g.id).map(q=>q.id),g.title);return;}
      if(ac==='missed'){const ids=Q.filter(q=>state.latest[q.id]&&state.latest[q.id]!==q.correct).map(q=>q.id);if(ids.length)start(ids,'Previously missed questions');return;}
      if(ac==='resume'){if(state.session){view='quiz';render();scrollTop();}return;}
      if(ac==='answer'){onAnswer(btn.dataset.value);return;}
      if(ac==='prev'){if(state.session&&state.session.index>0){state.session.index--;save();render();scrollTop();}return;}
      if(ac==='next'){next();return;}
      if(ac==='skip'){skip();return;}
      if(ac==='jump'){const i=Number(btn.dataset.index);if(state.session&&Number.isInteger(i)&&i>=0&&i<state.session.ids.length){state.session.index=i;save();render();scrollTop();}return;}
      if(ac==='results'){view='results';render();scrollTop();return;}
      if(ac==='review'){const s=state.session;if(!s)return;const i=s.ids.indexOf(btn.dataset.id);if(i>=0){s.index=i;view='quiz';save();render();scrollTop();}return;}
      if(ac==='retrywrong'){const s=state.session;if(s){const ids=s.ids.filter(id=>s.responses[id]&&s.responses[id]!==byId[id].correct);if(ids.length)start(ids,'Retry incorrect answers');}return;}
      if(ac==='restart'){const s=state.session;if(s&&confirm('Restart this practice and reset its answers?'))start(s.originIds||s.ids,s.label);return;}
      if(ac==='export'){exportCSV();return;}
      if(ac==='reset'){if(confirm('Delete your saved progress and missed-question history for this question bank?')){state={session:null,latest:{}};save();view='home';render();scrollTop();}return;}
    });
    document.addEventListener('keydown',e=>{if(view!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(e.target.closest('button,input,textarea,select,summary'))return;const key=e.key.toUpperCase();let letter=/^[1-4]$/.test(key)?letters[Number(key)-1]:(letters.includes(key)?key:null);if(letter){onAnswer(letter);return;}if(e.key==='ArrowRight'&&state.session){e.preventDefault();next();}if(e.key==='ArrowLeft'&&state.session&&state.session.index>0){e.preventDefault();state.session.index--;save();render();scrollTop();}});
    render();
  })();
  </script>
</body>
