  <script type="application/json" id="quiz-dataset">{"questions":[{"id":"Q001","local":1,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":2,"q":"What does uncertainty in Artificial Intelligence refer to?","options":{"A":"Insufficient or ambiguous information affecting data or decisions","B":"Additional goal information guiding the search process","C":"Assigning allowable values to variables under constraints","D":"Converting precise inputs into fuzzy membership values"},"correct":"A","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 1)","answer_text":"Insufficient or ambiguous information affecting data or decisions"},{"id":"Q002","local":2,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":2,"q":"Which type of uncertainty arises from noisy or incomplete training data?","options":{"A":"Environmental uncertainty","B":"Data uncertainty","C":"Algorithmic uncertainty","D":"Model uncertainty"},"correct":"B","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 1)","answer_text":"Data uncertainty"},{"id":"Q003","local":3,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":2,"q":"Which uncertainty is associated with selecting model architectures, optimization algorithms, and hyperparameters?","options":{"A":"Model uncertainty","B":"Data uncertainty","C":"Environmental uncertainty","D":"Algorithmic uncertainty"},"correct":"A","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 1)","answer_text":"Model uncertainty"},{"id":"Q004","local":4,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":2,"q":"Different machine-learning algorithms produce different predictions for the same dataset because of their mathematical formulations. Which uncertainty does this represent?","options":{"A":"Environmental uncertainty","B":"Model uncertainty","C":"Data uncertainty","D":"Algorithmic uncertainty"},"correct":"D","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 1)","answer_text":"Algorithmic uncertainty"},{"id":"Q005","local":5,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":3,"q":"An autonomous vehicle encounters unexpected weather conditions and road construction. Which uncertainty is most directly involved?","options":{"A":"Data uncertainty","B":"Model uncertainty","C":"Environmental uncertainty","D":"Algorithmic uncertainty"},"correct":"C","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 1)","answer_text":"Environmental uncertainty"},{"id":"Q006","local":6,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":3,"q":"What is the main purpose of using probabilistic models to handle uncertainty in AI?","options":{"A":"To identify combinations that violate constraints","B":"To represent statements using binary truth values","C":"To evaluate alternative moves in game trees","D":"To quantify uncertainty and support informed decisions"},"correct":"D","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, pp. 1–2)","answer_text":"To quantify uncertainty and support informed decisions"},{"id":"Q007","local":7,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":3,"q":"What is Probabilistic Logic Programming (PLP)?","options":{"A":"A technique for assigning values to constrained variables","B":"A method for representing intermediate degrees of truth","C":"An approach combining logic and probability to handle uncertainty","D":"An algorithm for selecting moves through game-tree pruning"},"correct":"C","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 2)","answer_text":"An approach combining logic and probability to handle uncertainty"},{"id":"Q008","local":8,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":3,"q":"Which pair of techniques is mentioned for implementing Probabilistic Logic Programming?","options":{"A":"Fuzzy Prolog and fuzzy description logic","B":"Depth-first search and breadth-first search","C":"Minimax algorithm and alpha-beta pruning","D":"Bayesian logic programs and Markov logic networks"},"correct":"D","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 2)","answer_text":"Bayesian logic programs and Markov logic networks"},{"id":"Q009","local":9,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":3,"q":"Which statement best describes Fuzzy Logic Programming (FLP)?","options":{"A":"It combines probabilities with logical rules for uncertain facts.","B":"It combines regular and fuzzy logic for imprecise information.","C":"It combines variables and domains to restrict assignments.","D":"It combines search thresholds to eliminate game-tree branches."},"correct":"B","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 2)","answer_text":"It combines regular and fuzzy logic for imprecise information."},{"id":"Q010","local":10,"group":"topic-1","topic":"Uncertainty in Artificial Intelligence","page":4,"q":"Which pair of applications is specifically associated with Fuzzy Logic Programming in the material?","options":{"A":"Map colouring and constraint propagation","B":"Game playing and node pruning","C":"Goal estimation and graph traversal","D":"Language understanding and image processing"},"correct":"D","source":"(Topic: Uncertainty in Artificial Intelligence | Source: What is Uncertainty in Artificial Intelligence.docx, p. 2)","answer_text":"Language understanding and image processing"},{"id":"Q011","local":11,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":4,"q":"What is the fundamental principle of fuzzy logic?","options":{"A":"Representing decisions with binary truth assignments","B":"Selecting assignments that satisfy fixed constraints","C":"Representing reasoning through intermediate degrees of truth","D":"Updating probabilities when new evidence appears"},"correct":"C","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 1)","answer_text":"Representing reasoning through intermediate degrees of truth"},{"id":"Q012","local":12,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":4,"q":"How does fuzzy logic differ from conventional logic according to the study material?","options":{"A":"Conventional logic uses membership; fuzzy logic uses constraints.","B":"Conventional logic uses probabilities; fuzzy logic uses game trees.","C":"Conventional logic uses domains; fuzzy logic uses state spaces.","D":"Conventional logic uses true/false; fuzzy logic allows intermediate possibilities."},"correct":"D","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, pp. 1–2)","answer_text":"Conventional logic uses true/false; fuzzy logic allows intermediate possibilities."},{"id":"Q013","local":13,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":4,"q":"Which statement correctly interprets truth values in fuzzy logic?","options":{"A":"1.0 represents absolute truth, and 0.0 represents absolute falseness.","B":"1.0 represents absolute falseness, and 0.0 represents absolute truth.","C":"1.0 represents partial truth, and 0.0 represents absolute truth.","D":"1.0 represents partial falseness, and 0.0 represents partial truth."},"correct":"A","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 2)","answer_text":"1.0 represents absolute truth, and 0.0 represents absolute falseness."},{"id":"Q014","local":14,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":4,"q":"Which operation converts crisp data into fuzzy data sets?","options":{"A":"Evaluating rules through the inference engine","B":"Combining results obtained from different rules","C":"Applying membership functions during fuzzification","D":"Converting output data into non-fuzzy values"},"correct":"C","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 2)","answer_text":"Applying membership functions during fuzzification"},{"id":"Q015","local":15,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":5,"q":"What are the two operations performed by the inference engine in the fuzzy logic algorithm?","options":{"A":"Defining linguistic terms and membership functions","B":"Evaluating rules and combining their results","C":"Selecting variables and assigning their domains","D":"Listing set members and organizing their properties"},"correct":"B","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 2)","answer_text":"Evaluating rules and combining their results"},{"id":"Q016","local":16,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":5,"q":"According to the fuzzy logic algorithm, what happens after combining the results of individual rules?","options":{"A":"The output data is converted into non-fuzzy values.","B":"The linguistic variables and terms are defined.","C":"The membership functions are constructed again.","D":"The knowledge base of rules is constructed."},"correct":"A","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 2)","answer_text":"The output data is converted into non-fuzzy values."},{"id":"Q017","local":17,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":5,"q":"In the air-conditioning example, which values does the fuzzy logic system compare to adjust the temperature?","options":{"A":"Room temperature and target temperature","B":"Room temperature and humidity level","C":"Outside temperature and humidity level","D":"Outside temperature and target pressure"},"correct":"A","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 1)","answer_text":"Room temperature and target temperature"},{"id":"Q018","local":18,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":5,"q":"How is a set defined in classical set theory?","options":{"A":"An ordered sequence of repeated elements","B":"A collection of graded truth values","C":"An unordered collection of distinct elements","D":"A collection of conditionally probable events"},"correct":"C","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 3)","answer_text":"An unordered collection of distinct elements"},{"id":"Q019","local":19,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":5,"q":"Which representation explicitly lists the elements of a set inside braces?","options":{"A":"Roster or tabular form","B":"Set-builder notation","C":"Cartesian-product notation","D":"Complement notation"},"correct":"A","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, pp. 3–4)","answer_text":"Roster or tabular form"},{"id":"Q020","local":20,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":6,"q":"Which statement correctly describes set-builder notation?","options":{"A":"The elements are listed inside braces with commas.","B":"The elements are defined through a common property.","C":"The elements are arranged as ordered cross-set pairs.","D":"The elements are selected outside a given set."},"correct":"B","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 4)","answer_text":"The elements are defined through a common property."},{"id":"Q021","local":21,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":6,"q":"Which set operation produces elements belonging to A, B, or both?","options":{"A":"Set difference","B":"Set complement","C":"Set intersection","D":"Set union"},"correct":"D","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 4)","answer_text":"Set union"},{"id":"Q022","local":22,"group":"topic-2","topic":"Fuzzy Logic and Classical Set Theory","page":6,"q":"What does the Cartesian product A × B represent?","options":{"A":"A set containing elements shared by both A and B","B":"A set containing elements in A but excluded from B","C":"A set containing elements outside A in the universal set","D":"A set containing all ordered pairs drawn from A and B"},"correct":"D","source":"(Topic: Fuzzy Logic and Classical Set Theory | Source: Fuzzy Logic.docx, p. 5)","answer_text":"A set containing all ordered pairs drawn from A and B"},{"id":"Q023","local":23,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":6,"q":"What constitutes a valid solution to a Constraint Satisfaction Problem?","options":{"A":"An assignment to some variables, regardless of constraints","B":"A complete assignment that satisfies every constraint","C":"A collection of values without variable assignments","D":"A set of variables without specified domains"},"correct":"B","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"A complete assignment that satisfies every constraint"},{"id":"Q024","local":24,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":6,"q":"Which three components formally define a Constraint Satisfaction Problem?","options":{"A":"Agents, percepts, and actions","B":"States, moves, and payoffs","C":"Facts, rules, and conclusions","D":"Variables, domains, and constraints"},"correct":"D","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"Variables, domains, and constraints"},{"id":"Q025","local":25,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":7,"q":"In a CSP, what does the domain Di represent?","options":{"A":"The set of variables sharing constraints","B":"The sequence of possible variable assignments","C":"The set of allowable values for variable Xi","D":"The collection of complete problem solutions"},"correct":"C","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"The set of allowable values for variable Xi"},{"id":"Q026","local":26,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":7,"q":"In a constraint represented by the pair (scope, rel), what does scope specify?","options":{"A":"The variables participating in the constraint","B":"The values permitted by the constraint","C":"The assignments completing the problem","D":"The states eliminated from the search"},"correct":"A","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"The variables participating in the constraint"},{"id":"Q027","local":27,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":7,"q":"What does the relation (rel) define in a CSP constraint?","options":{"A":"The complete set of problem variables","B":"The sequence of actions reaching a state","C":"The allowable combinations of variable values","D":"The total number of assignments examined"},"correct":"C","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"The allowable combinations of variable values"},{"id":"Q028","local":28,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":7,"q":"What makes an assignment consistent or legal in a CSP?","options":{"A":"It does not violate any constraints.","B":"It assigns values to every variable.","C":"It gives every variable multiple values.","D":"It eliminates the constraints from the problem."},"correct":"A","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"It does not violate any constraints."},{"id":"Q029","local":29,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":7,"q":"What is a partial assignment in a Constraint Satisfaction Problem?","options":{"A":"An assignment containing values for every variable","B":"An assignment with no defined variable domains","C":"An assignment giving values to some variables","D":"An assignment containing every possible solution"},"correct":"C","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"An assignment giving values to some variables"},{"id":"Q030","local":30,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":8,"q":"What distinguishes a complete assignment from a partial assignment?","options":{"A":"Every constraint has been removed from the problem.","B":"Every variable has been assigned a value.","C":"Every variable has multiple possible values.","D":"Every neighbouring variable shares a value."},"correct":"B","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"Every variable has been assigned a value."},{"id":"Q031","local":31,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":8,"q":"In the Australian map-colouring CSP, what restriction applies to neighbouring regions?","options":{"A":"Neighbouring regions must receive identical colours.","B":"Every region must receive a unique colour.","C":"Neighbouring regions must receive different colours.","D":"Every region must receive multiple colours."},"correct":"C","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"Neighbouring regions must receive different colours."},{"id":"Q032","local":32,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":8,"q":"What is the domain of each region in the Australian map-colouring example?","options":{"A":"{red, green, blue}","B":"{WA, NT, Q}","C":"{SA, NSW, V}","D":"{T, WA, SA}"},"correct":"A","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 1)","answer_text":"{red, green, blue}"},{"id":"Q033","local":33,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":8,"q":"In the Australian map-colouring example, if South Australia (SA) is assigned blue, what follows for its five neighbouring regions?","options":{"A":"They must all receive the same remaining colour.","B":"They cannot be assigned the colour blue.","C":"They can no longer receive the colour green.","D":"They must all be assigned the colour red."},"correct":"B","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 2)","answer_text":"They cannot be assigned the colour blue."},{"id":"Q034","local":34,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":8,"q":"Which of the following represents a unary constraint in the map-colouring example?","options":{"A":"SA ≠ NSW","B":"SA ≠ NT","C":"SA ≠ green","D":"WA ≠ NT"},"correct":"C","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 2)","answer_text":"SA ≠ green"},{"id":"Q035","local":35,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":9,"q":"What is the defining characteristic of a binary constraint?","options":{"A":"It relates two variables.","B":"It restricts one variable.","C":"It involves arbitrary variables.","D":"It eliminates all domains."},"correct":"A","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 2)","answer_text":"It relates two variables."},{"id":"Q036","local":36,"group":"topic-3","topic":"Constraint Satisfaction Problems (CSP)","page":9,"q":"What is a global constraint in a CSP?","options":{"A":"A constraint restricting a single variable","B":"A constraint involving an arbitrary number of variables","C":"A constraint relating exactly two variables","D":"A constraint selecting the final variable assignment"},"correct":"B","source":"(Topic: Constraint Satisfaction Problems (CSP) | Source: Constraint satisfaction problem.docx, p. 2)","answer_text":"A constraint involving an arbitrary number of variables"},{"id":"Q037","local":37,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":9,"q":"What is the primary purpose of Bayes' Theorem?","options":{"A":"Creating rules for an expert system","B":"Eliminating branches from a game tree","C":"Assigning legal values to CSP variables","D":"Updating event probabilities using new evidence"},"correct":"D","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"Updating event probabilities using new evidence"},{"id":"Q038","local":38,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":9,"q":"What is conditional probability?","options":{"A":"The probability of an event before considering evidence","B":"The probability of an event given another event has occurred","C":"The probability of all possible events occurring together","D":"The probability of an event without any given condition"},"correct":"B","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"The probability of an event given another event has occurred"},{"id":"Q039","local":39,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":9,"q":"Which expression represents the posterior probability in Bayes' Theorem?","options":{"A":"P(A)","B":"P(B|A)","C":"P(A|B)","D":"P(B)"},"correct":"C","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"P(A|B)"},{"id":"Q040","local":40,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":10,"q":"Which expression represents the likelihood in Bayes' Theorem?","options":{"A":"P(B|A)","B":"P(A|B)","C":"P(B)","D":"P(A)"},"correct":"A","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"P(B|A)"},{"id":"Q041","local":41,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":10,"q":"Which expression denotes the prior probability of hypothesis A?","options":{"A":"P(B)","B":"P(A)","C":"P(B|A)","D":"P(A|B)"},"correct":"B","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"P(A)"},{"id":"Q042","local":42,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":10,"q":"Which expression represents the marginal probability of evidence B?","options":{"A":"P(A|B)","B":"P(B|A)","C":"P(B)","D":"P(A)"},"correct":"C","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"P(B)"},{"id":"Q043","local":43,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":10,"q":"Which formula correctly represents Bayes' Theorem?","options":{"A":"P(A|B) = [P(A) × P(B)] / P(B|A)","B":"P(A|B) = [P(B|A) × P(A)] / P(B)","C":"P(A|B) = [P(B|A) × P(B)] / P(A)","D":"P(A|B) = P(B|A) × P(A) × P(B)"},"correct":"B","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"P(A|B) = [P(B|A) × P(A)] / P(B)"},{"id":"Q044","local":44,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":10,"q":"In the conditional-probability expressions provided in the material, what does the symbol ∧ represent?","options":{"A":"AND or intersection","B":"Given that an event occurred","C":"Posterior probability","D":"Marginal probability"},"correct":"A","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 1)","answer_text":"AND or intersection"},{"id":"Q045","local":45,"group":"topic-4","topic":"Bayes' Theorem and Conditional Probability","page":11,"q":"In the meningitis example, let A represent having meningitis and B represent having a stiff neck. What does P(B|A) = 0.8 mean?","options":{"A":"The probability of meningitis before observing a stiff neck","B":"The probability of a stiff neck given that meningitis is present","C":"The probability of a stiff neck without knowing about meningitis","D":"The probability of meningitis given that a stiff neck is present"},"correct":"B","source":"(Topic: Bayes' Theorem and Conditional Probability | Source: Baye's Theorem.docx, p. 2)","answer_text":"The probability of a stiff neck given that meningitis is present"},{"id":"Q046","local":46,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":11,"q":"What is the primary benefit of alpha-beta pruning compared with standard minimax?","options":{"A":"It changes the selected move while examining the same nodes.","B":"It selects moves without examining the game tree.","C":"It returns different moves through reordered game-tree search.","D":"It returns the same move while skipping irrelevant nodes."},"correct":"D","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"It returns the same move while skipping irrelevant nodes."},{"id":"Q047","local":47,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":11,"q":"What does alpha (α) represent in alpha-beta pruning?","options":{"A":"The best highest-value choice found for the Maximizer","B":"The best lowest-value choice found for the Minimizer","C":"The first terminal-node value encountered in the tree","D":"The total number of nodes explored in the tree"},"correct":"A","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"The best highest-value choice found for the Maximizer"},{"id":"Q048","local":48,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":11,"q":"What is the initial value of beta (β) in alpha-beta pruning?","options":{"A":"−∞","B":"0","C":"+∞","D":"1"},"correct":"C","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"+∞"},{"id":"Q049","local":49,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":11,"q":"Which condition causes pruning in the alpha-beta algorithm?","options":{"A":"α < β","B":"α = −∞","C":"β = +∞","D":"α ≥ β"},"correct":"D","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"α ≥ β"},{"id":"Q050","local":50,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":12,"q":"Which player is responsible for updating beta (β) during alpha-beta pruning?","options":{"A":"Maximizer during its turns","B":"Both players during their turns","C":"Each leaf during evaluation","D":"Minimizer during its turns"},"correct":"D","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"Minimizer during its turns"},{"id":"Q051","local":51,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":12,"q":"Which values are passed from parent nodes to child nodes during alpha-beta pruning?","options":{"A":"The evaluated scores of completed parent nodes","B":"The current alpha and beta threshold values","C":"The final minimax values of all game states","D":"The previously selected moves of both players"},"correct":"B","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, pp. 1–2)","answer_text":"The current alpha and beta threshold values"},{"id":"Q052","local":52,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":12,"q":"What is the initial value of alpha (α) in alpha-beta pruning?","options":{"A":"Negative infinity (−∞)","B":"Positive infinity (+∞)","C":"Zero (0)","D":"One (1)"},"correct":"A","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"Negative infinity (−∞)"},{"id":"Q053","local":53,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":12,"q":"At which depth of a game tree can alpha-beta pruning be applied?","options":{"A":"At the terminal-node depth","B":"At the root-node depth","C":"At the first child-node depth","D":"At any depth of the tree"},"correct":"D","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"At any depth of the tree"},{"id":"Q054","local":54,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":12,"q":"What can alpha-beta pruning eliminate from the search when the pruning condition is satisfied?","options":{"A":"The previously evaluated parent path","B":"The selected move at the root node","C":"An entire unexplored subtree","D":"The already examined terminal nodes"},"correct":"C","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, pp. 1, 4)","answer_text":"An entire unexplored subtree"},{"id":"Q055","local":55,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":13,"q":"Which values are passed to upper nodes when backtracking in the alpha-beta pruning algorithm?","options":{"A":"The current alpha threshold values","B":"The evaluated node values","C":"The current beta threshold values","D":"The ordered move priorities"},"correct":"B","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 1)","answer_text":"The evaluated node values"},{"id":"Q056","local":56,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":13,"q":"In the provided alpha-beta pruning example, node D is a Maximizer with child values 2 and 3. Which value is selected for node D?","options":{"A":"0","B":"1","C":"2","D":"3"},"correct":"D","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 2)","answer_text":"3"},{"id":"Q057","local":57,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":13,"q":"In the worked example, node E has α = 5 and β = 3. What action does the algorithm perform?","options":{"A":"Prunes the right successor of node E","B":"Evaluates the right successor of node E","C":"Recalculates both successors of node E","D":"Restarts the search from the root node"},"correct":"A","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, p. 3)","answer_text":"Prunes the right successor of node E"},{"id":"Q058","local":58,"group":"topic-5","topic":"Minimax and Alpha-Beta Pruning","page":13,"q":"Which move-ordering sequence is recommended for chess in the provided alpha-beta pruning material?","options":{"A":"Threats, captures, backward moves, forward moves","B":"Forward moves, backward moves, captures, threats","C":"Captures, threats, forward moves, backward moves","D":"Backward moves, forward moves, threats, captures"},"correct":"C","source":"(Topic: Minimax and Alpha-Beta Pruning | Source: Alpha beta pruning.docx, pp. 4–5)","answer_text":"Captures, threats, forward moves, backward moves"},{"id":"Q059","local":59,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":14,"q":"What is an expert system in Artificial Intelligence?","options":{"A":"A program developed to traverse graphs using search algorithms","B":"A program designed to assign values under predefined constraints","C":"A computer application that solves complex domain-specific problems using expertise","D":"A computer application that represents uncertainty through membership values"},"correct":"C","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 1)","answer_text":"A computer application that solves complex domain-specific problems using expertise"},{"id":"Q060","local":60,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":14,"q":"Which of the following is listed as a characteristic of expert systems?","options":{"A":"Independent knowledge refinement","B":"High responsiveness","C":"Human decision substitution","D":"Possession of human capabilities"},"correct":"B","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 1)","answer_text":"High responsiveness"},{"id":"Q061","local":61,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":14,"q":"Which activity is listed as something expert systems are incapable of performing?","options":{"A":"Refining their own knowledge","B":"Diagnosing a particular problem","C":"Predicting possible results","D":"Explaining their conclusions"},"correct":"A","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 1)","answer_text":"Refining their own knowledge"},{"id":"Q062","local":62,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":14,"q":"Which set correctly identifies the three main components of an expert system?","options":{"A":"Variables, domains, and constraints","B":"Agents, environments, and actions","C":"Propositions, connectives, and truth values","D":"Knowledge base, inference engine, and user interface"},"correct":"D","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, pp. 1–2)","answer_text":"Knowledge base, inference engine, and user interface"},{"id":"Q063","local":63,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":14,"q":"What is the primary purpose of the knowledge base in an expert system?","options":{"A":"To arrange the user's interactions with the system","B":"To store high-quality, domain-specific knowledge","C":"To choose search paths through a problem space","D":"To evaluate the truth values of logical statements"},"correct":"B","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 2)","answer_text":"To store high-quality, domain-specific knowledge"},{"id":"Q064","local":64,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":15,"q":"According to the material, knowledge is formed by combining which elements?","options":{"A":"Variables, domains, and allowable values","B":"Conditions, rules, and search thresholds","C":"Data, information, and past experience","D":"Propositions, operators, and truth values"},"correct":"C","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 2)","answer_text":"Data, information, and past experience"},{"id":"Q065","local":65,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":15,"q":"What is factual knowledge in an expert system?","options":{"A":"Information widely accepted by scholars and knowledge engineers","B":"Information derived from practical judgement and educated guessing","C":"Information collected through a user's interface interactions","D":"Information generated while resolving conflicts among rules"},"correct":"A","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 2)","answer_text":"Information widely accepted by scholars and knowledge engineers"},{"id":"Q066","local":66,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":15,"q":"Which description best represents heuristic knowledge?","options":{"A":"Domain information accepted by scholars and knowledge engineers","B":"Data organized into facts describing the task domain","C":"Rules displayed through the system's user interface","D":"Practical judgement, evaluation, experience, and guessing"},"correct":"D","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 2)","answer_text":"Practical judgement, evaluation, experience, and guessing"},{"id":"Q067","local":67,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":15,"q":"Which form of knowledge representation is described in the expert systems material?","options":{"A":"Variable-domain-constraint relationships","B":"Propositional truth-value tables","C":"State-space traversal sequences","D":"IF-THEN-ELSE rules"},"correct":"D","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, pp. 2–3)","answer_text":"IF-THEN-ELSE rules"},{"id":"Q068","local":68,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":15,"q":"How does a knowledge engineer acquire information from a subject expert?","options":{"A":"Through recording, interviewing, and observing the expert","B":"Through evaluating nodes in an adversarial game tree","C":"Through assigning membership values to fuzzy variables","D":"Through selecting values that satisfy CSP constraints"},"correct":"A","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 3)","answer_text":"Through recording, interviewing, and observing the expert"},{"id":"Q069","local":69,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":16,"q":"After gathering information from a domain expert, what does the knowledge engineer do?","options":{"A":"Assigns truth values to each statement in the knowledge base","B":"Evaluates alternative moves to select an optimal game decision","C":"Categorizes and organizes information into meaningful rules","D":"Converts domain information into fuzzy membership functions"},"correct":"C","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 3)","answer_text":"Categorizes and organizes information into meaningful rules"},{"id":"Q070","local":70,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":16,"q":"What is the main function of the inference engine in a knowledge-based expert system?","options":{"A":"To provide the user with a natural-language interface","B":"To acquire and manipulate knowledge to derive solutions","C":"To collect information from experts through interviews","D":"To store the factual and heuristic knowledge of a domain"},"correct":"B","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 3)","answer_text":"To acquire and manipulate knowledge to derive solutions"},{"id":"Q071","local":71,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":16,"q":"When multiple rules are applicable to the same case, what can the inference engine do?","options":{"A":"Replace the user interface with a different component","B":"Discard the facts stored in the knowledge base","C":"Convert the applicable rules into membership functions","D":"Resolve conflicts between the applicable rules"},"correct":"D","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 3)","answer_text":"Resolve conflicts between the applicable rules"},{"id":"Q072","local":72,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":16,"q":"Which inference strategy answers the question \"What can happen next?\"","options":{"A":"Backward chaining, which identifies possible causes","B":"Forward chaining, which derives possible outcomes","C":"Knowledge acquisition, which collects domain facts","D":"Knowledge representation, which organizes domain rules"},"correct":"B","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 3)","answer_text":"Forward chaining, which derives possible outcomes"},{"id":"Q073","local":73,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":16,"q":"Which statement correctly describes backward chaining?","options":{"A":"It starts from a known result and investigates possible causes.","B":"It starts from available facts and predicts future outcomes.","C":"It collects domain knowledge through interviews and observation.","D":"It presents recommendations through natural-language explanations."},"correct":"A","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 3)","answer_text":"It starts from a known result and investigates possible causes."},{"id":"Q074","local":74,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":17,"q":"How can the user interface explain an expert system's recommendation?","options":{"A":"By updating the alpha and beta thresholds","B":"By modifying variable values in a CSP","C":"By displaying natural-language explanations or rule numbers","D":"By changing the domain knowledge automatically"},"correct":"C","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 4)","answer_text":"By displaying natural-language explanations or rule numbers"},{"id":"Q075","local":75,"group":"topic-6","topic":"Expert Systems and Knowledge Acquisition","page":17,"q":"Which benefit of expert systems describes their ability to operate in environments dangerous to humans?","options":{"A":"Reducing risk","B":"Increasing availability","C":"Improving response speed","D":"Lowering production cost"},"correct":"A","source":"(Topic: Expert Systems and Knowledge Acquisition | Source: expert system and knowledge acquisition.docx, p. 4)","answer_text":"Reducing risk"},{"id":"Q076","local":76,"group":"topic-7","topic":"Propositional Logic","page":17,"q":"Which statement best describes a proposition in propositional logic?","options":{"A":"A statement containing several possible numerical values","B":"A statement describing an action without a truth value","C":"A declarative statement that is either true or false","D":"A statement assigning probabilities to possible outcomes"},"correct":"C","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 1)","answer_text":"A declarative statement that is either true or false"},{"id":"Q077","local":77,"group":"topic-7","topic":"Propositional Logic","page":17,"q":"Why is propositional logic also called Boolean logic?","options":{"A":"It assigns membership values between zero and one.","B":"It updates probabilities using conditional evidence.","C":"It describes possible values within variable domains.","D":"It works with binary truth values represented by 0 and 1."},"correct":"D","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 1)","answer_text":"It works with binary truth values represented by 0 and 1."},{"id":"Q078","local":78,"group":"topic-7","topic":"Propositional Logic","page":17,"q":"What is an atomic proposition?","options":{"A":"A proposition formed by joining several simpler statements","B":"A simple proposition consisting of one proposition symbol","C":"A proposition created through multiple logical connectives","D":"A compound proposition containing several logical operators"},"correct":"B","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 1)","answer_text":"A simple proposition consisting of one proposition symbol"},{"id":"Q079","local":79,"group":"topic-7","topic":"Propositional Logic","page":18,"q":"How is a complex proposition constructed?","options":{"A":"By combining simpler propositions using logical connectives and parentheses","B":"By assigning several truth values to a single proposition symbol","C":"By replacing proposition symbols with probability values and domains","D":"By removing logical connectives from related declarative statements"},"correct":"A","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 1)","answer_text":"By combining simpler propositions using logical connectives and parentheses"},{"id":"Q080","local":80,"group":"topic-7","topic":"Propositional Logic","page":18,"q":"Which expression represents the negation of proposition P?","options":{"A":"P ∧ Q","B":"P ∨ Q","C":"P → Q","D":"¬P"},"correct":"D","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 1)","answer_text":"¬P"},{"id":"Q081","local":81,"group":"topic-7","topic":"Propositional Logic","page":18,"q":"Which logical expression represents the conjunction of P and Q?","options":{"A":"P ∨ Q","B":"P → Q","C":"P ∧ Q","D":"P ⇔ Q"},"correct":"C","source":"(Topic: Propositional Logic | Source: propositional logic.docx, pp. 1–2)","answer_text":"P ∧ Q"},{"id":"Q082","local":82,"group":"topic-7","topic":"Propositional Logic","page":18,"q":"Which expression represents the disjunction of two propositions P and Q?","options":{"A":"P ∧ Q","B":"P ∨ Q","C":"P → Q","D":"P ⇔ Q"},"correct":"B","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 2)","answer_text":"P ∨ Q"},{"id":"Q083","local":83,"group":"topic-7","topic":"Propositional Logic","page":18,"q":"If P means \"It is raining\" and Q means \"The street is wet,\" which expression represents \"If it is raining, then the street is wet\"?","options":{"A":"P → Q","B":"P ∧ Q","C":"P ∨ Q","D":"P ⇔ Q"},"correct":"A","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 2)","answer_text":"P → Q"},{"id":"Q084","local":84,"group":"topic-7","topic":"Propositional Logic","page":19,"q":"Which expression represents the biconditional relationship between P and Q?","options":{"A":"P ∧ Q","B":"P → Q","C":"P ⇔ Q","D":"P ∨ Q"},"correct":"C","source":"(Topic: Propositional Logic | Source: propositional logic.docx, p. 2)","answer_text":"P ⇔ Q"},{"id":"Q085","local":85,"group":"topic-7","topic":"Propositional Logic","page":19,"q":"According to the truth table in the uploaded material, when is the conjunction P ∧ Q true?","options":{"A":"When P is true and Q is false","B":"When P is true and Q is true","C":"When P is false and Q is true","D":"When P is false and Q is false"},"correct":"B","source":"(Topic: Propositional Logic | Source: propositional logic.docx, pp. 2, Truth Tables)","answer_text":"When P is true and Q is true"},{"id":"Q086","local":86,"group":"topic-7","topic":"Propositional Logic","page":19,"q":"Under which condition is the disjunction P ∨ Q false?","options":{"A":"When P is true and Q is true","B":"When P is true and Q is false","C":"When P is false and Q is true","D":"When P is false and Q is false"},"correct":"D","source":"(Topic: Propositional Logic | Source: propositional logic.docx, pp. 2, Truth Tables)","answer_text":"When P is false and Q is false"},{"id":"Q087","local":87,"group":"topic-7","topic":"Propositional Logic","page":19,"q":"According to the implication truth table, when is P → Q false?","options":{"A":"When P is true and Q is false","B":"When P is true and Q is true","C":"When P is false and Q is true","D":"When P is false and Q is false"},"correct":"A","source":"(Topic: Propositional Logic | Source: propositional logic.docx, pp. 2, Truth Tables)","answer_text":"When P is true and Q is false"},{"id":"Q088","local":88,"group":"topic-7","topic":"Propositional Logic","page":19,"q":"According to the precedence table in the document, which operator has the highest precedence after parentheses?","options":{"A":"Conjunction","B":"Negation","C":"Disjunction","D":"Implication"},"correct":"B","source":"(Topic: Propositional Logic | Source: propositional logic.docx, pp. 3, Precedence Table)","answer_text":"Negation"},{"id":"Q089","local":89,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":20,"q":"Which data structure is used in the standard DFS algorithm to manage vertices waiting to be processed?","options":{"A":"A queue with front removal","B":"A list of constraint values","C":"A table of truth assignments","D":"A stack with top removal"},"correct":"D","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 1)","answer_text":"A stack with top removal"},{"id":"Q090","local":90,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":20,"q":"What does the standard DFS algorithm do with a vertex after taking it from the top of the stack?","options":{"A":"It places the vertex at the back of a queue.","B":"It removes the vertex from the graph permanently.","C":"It assigns the vertex a new domain of values.","D":"It adds the vertex to the visited list."},"correct":"D","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 1)","answer_text":"It adds the vertex to the visited list."},{"id":"Q091","local":91,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":20,"q":"Why does the DFS algorithm avoid adding already visited adjacent vertices to the stack?","options":{"A":"To determine the shortest possible path","B":"To reorder every vertex in the graph","C":"To avoid cycles during graph traversal","D":"To assign new values to neighbouring vertices"},"correct":"C","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 1)","answer_text":"To avoid cycles during graph traversal"},{"id":"Q092","local":92,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":20,"q":"According to the algorithm provided, when does the DFS traversal stop?","options":{"A":"When the queue becomes empty","B":"When the stack becomes empty","C":"When the graph becomes connected","D":"When the start vertex is revisited"},"correct":"B","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 1)","answer_text":"When the stack becomes empty"},{"id":"Q093","local":93,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":20,"q":"Which data structure does Breadth-First Search use to manage vertices awaiting traversal?","options":{"A":"A stack","B":"A truth table","C":"A knowledge base","D":"A queue"},"correct":"D","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 4)","answer_text":"A queue"},{"id":"Q094","local":94,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":21,"q":"From which position does BFS remove the next vertex to be visited?","options":{"A":"The front of the queue","B":"The top of the stack","C":"The back of the queue","D":"The bottom of the stack"},"correct":"A","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 4)","answer_text":"The front of the queue"},{"id":"Q095","local":95,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":21,"q":"Where does BFS place newly discovered adjacent vertices that have not been visited?","options":{"A":"At the front of the queue","B":"At the back of the queue","C":"At the bottom of the stack","D":"At the top of the stack"},"correct":"B","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 4)","answer_text":"At the back of the queue"},{"id":"Q096","local":96,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":21,"q":"According to the standard BFS algorithm, which condition indicates that traversal has finished?","options":{"A":"The stack contains the final vertex.","B":"The queue contains the starting vertex.","C":"The queue has become empty.","D":"The stack has reached its maximum size."},"correct":"C","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, pp. 4, 7)","answer_text":"The queue has become empty."},{"id":"Q097","local":97,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":21,"q":"How does the uploaded material suggest covering every vertex when a graph contains disconnected parts?","options":{"A":"Run BFS on every node to cover all parts.","B":"Restart BFS from the same starting vertex.","C":"Remove the disconnected parts before searching.","D":"Combine the disconnected parts into one vertex."},"correct":"A","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, p. 4)","answer_text":"Run BFS on every node to cover all parts."},{"id":"Q098","local":98,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":21,"q":"Which statement correctly compares DFS and BFS based on their standard implementations in the uploaded material?","options":{"A":"DFS uses a queue, while BFS uses a stack.","B":"DFS and BFS both use stacks for pending vertices.","C":"DFS and BFS both use queues for pending vertices.","D":"DFS uses a stack, while BFS uses a queue."},"correct":"D","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, pp. 1, 4)","answer_text":"DFS uses a stack, while BFS uses a queue."},{"id":"Q099","local":99,"group":"topic-8","topic":"Depth-First Search and Breadth-First Search","page":22,"q":"Into which two categories do the standard DFS and BFS implementations classify graph vertices?","options":{"A":"Parent and child","B":"Complete and incomplete","C":"Visited and not visited","D":"Maximizer and minimizer"},"correct":"C","source":"(Topic: Depth-First Search and Breadth-First Search | Source: Depth First Search and BFS Algorithm.docx, pp. 1, 3)","answer_text":"Visited and not visited"},{"id":"Q100","local":100,"group":"topic-9","topic":"Informed and Uninformed Search","page":22,"q":"What is the main difference between informed and uninformed search according to the uploaded material?","options":{"A":"Informed search uses stacks, while uninformed search uses queues.","B":"Informed search uses goal-related knowledge, while uninformed search relies on the problem definition.","C":"Informed search uses constraints, while uninformed search uses propositions.","D":"Informed search uses game trees, while uninformed search uses fuzzy values."},"correct":"B","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"Informed search uses goal-related knowledge, while uninformed search relies on the problem definition."},{"id":"Q101","local":101,"group":"topic-9","topic":"Informed and Uninformed Search","page":22,"q":"What is the purpose of the function used in informed search?","options":{"A":"To determine allowable values under problem constraints","B":"To assign probabilities to possible outcomes","C":"To determine truth values of logical statements","D":"To estimate how close the current state is to the goal"},"correct":"D","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"To estimate how close the current state is to the goal"},{"id":"Q102","local":102,"group":"topic-9","topic":"Informed and Uninformed Search","page":22,"q":"Which of the following is an example of informed search mentioned in the material?","options":{"A":"Breadth-First Search (BFS)","B":"A* Search","C":"Depth-First Search (DFS)","D":"Lowest Cost First Search"},"correct":"B","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"A* Search"},{"id":"Q103","local":103,"group":"topic-9","topic":"Informed and Uninformed Search","page":23,"q":"Which pair of algorithms is categorized as uninformed search in the uploaded material?","options":{"A":"Greedy Search and A* Search","B":"Depth-First Search and Breadth-First Search","C":"Minimax Search and Alpha-Beta Pruning","D":"Forward Chaining and Backward Chaining"},"correct":"B","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"Depth-First Search and Breadth-First Search"},{"id":"Q104","local":104,"group":"topic-9","topic":"Informed and Uninformed Search","page":23,"q":"What information does uninformed search use during the searching process?","options":{"A":"Information provided in the problem definition","B":"Additional knowledge about the goal state","C":"Estimates of distance toward the goal state","D":"Probabilities assigned to possible outcomes"},"correct":"A","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"Information provided in the problem definition"},{"id":"Q105","local":105,"group":"topic-9","topic":"Informed and Uninformed Search","page":23,"q":"According to the uploaded document, which statement describes the completeness of informed search?","options":{"A":"It is guaranteed to be complete for every problem.","B":"It terminates after exploring every possible state.","C":"It may or may not be complete.","D":"It is complete whenever the problem has constraints."},"correct":"C","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"It may or may not be complete."},{"id":"Q106","local":106,"group":"topic-9","topic":"Informed and Uninformed Search","page":23,"q":"Which characteristic of informed search helps direct the search process toward a solution?","options":{"A":"Searching using the problem definition without added guidance","B":"Assigning values to variables under specified constraints","C":"Using knowledge that provides direction toward the goal","D":"Selecting the lowest-valued move for the Minimizer"},"correct":"C","source":"(Topic: Informed and Uninformed Search | Source: Informed and uninformed Search.docx, p. 1)","answer_text":"Using knowledge that provides direction toward the goal"},{"id":"Q107","local":107,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":24,"q":"How is Artificial Intelligence generally defined in the study material?","options":{"A":"The application of probability to uncertain information","B":"The science and engineering of making intelligent machines","C":"The study of fixed constraints and variable assignments","D":"The representation of truth through logical connectives"},"correct":"B","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 1)","answer_text":"The science and engineering of making intelligent machines"},{"id":"Q108","local":108,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":24,"q":"What is the scientific goal of AI according to the uploaded material?","options":{"A":"To organize uncertain information into probability distributions","B":"To determine allowable values in constraint-based problems","C":"To understand the working of the mind in mechanistic terms","D":"To develop mathematical rules for game-tree evaluation"},"correct":"C","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 1)","answer_text":"To understand the working of the mind in mechanistic terms"},{"id":"Q109","local":109,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":24,"q":"What does autonomy mean when defining Artificial Intelligence from an engineering perspective?","options":{"A":"Adjusting system behavior to environmental variation","B":"Understanding user requests from limited instructions","C":"Improving system performance through past experience","D":"Performing tasks without human operators or monitoring"},"correct":"D","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 1)","answer_text":"Performing tasks without human operators or monitoring"},{"id":"Q110","local":110,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":24,"q":"What does flexibility refer to in the engineering definition of AI?","options":{"A":"Dealing with variability in the environment","B":"Learning from previous experiences and outcomes","C":"Performing tasks without human supervision","D":"Understanding limited natural-language instructions"},"correct":"A","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 1)","answer_text":"Dealing with variability in the environment"},{"id":"Q111","local":111,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":24,"q":"Which ability represents ease of use in an intelligent computer system?","options":{"A":"Performing complex tasks without human monitoring","B":"Adapting to changes in environmental conditions","C":"Improving knowledge through repeated experience","D":"Understanding user needs from limited natural-language instructions"},"correct":"D","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 1)","answer_text":"Understanding user needs from limited natural-language instructions"},{"id":"Q112","local":112,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":25,"q":"What is the purpose of the Turing Test according to the material?","options":{"A":"To evaluate the speed of a computer program","B":"To test machine intelligence in comparison with human intelligence","C":"To compare the cost of different AI algorithms","D":"To measure the memory capacity of intelligent systems"},"correct":"B","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 2)","answer_text":"To test machine intelligence in comparison with human intelligence"},{"id":"Q113","local":113,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":25,"q":"Which development is associated with the year 1950 in the AI history slide?","options":{"A":"The use of CNNs for image classification","B":"The development of GAN-based image generation","C":"Alan Turing's Computing Machinery and Intelligence paper","D":"The development of deep reinforcement learning techniques"},"correct":"C","source":"(Topic: AI Foundations, History, Types, and Agents | Source: introduction to AI.pptx, slide 3)","answer_text":"Alan Turing's Computing Machinery and Intelligence paper"},{"id":"Q114","local":114,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":25,"q":"What characterizes Artificial Narrow Intelligence (ANI), also known as Weak AI?","options":{"A":"Performing a narrowly defined set of specific tasks","B":"Thinking and making decisions at a human level","C":"Surpassing humans in general intellectual capability","D":"Performing any intellectual task a human can perform"},"correct":"A","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 4)","answer_text":"Performing a narrowly defined set of specific tasks"},{"id":"Q115","local":115,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":25,"q":"How does the material describe Artificial General Intelligence (AGI)?","options":{"A":"Machines with the ability to think and decide like humans","B":"Machines restricted to predefined and specific functions","C":"Machines with capabilities exceeding those of humans","D":"Machines that respond using fuzzy membership values"},"correct":"A","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Machines with the ability to think and decide like humans"},{"id":"Q116","local":116,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":25,"q":"What defines Artificial Super Intelligence (ASI) in the study material?","options":{"A":"Computer systems performing narrowly defined tasks","B":"Computer systems surpassing human capabilities","C":"Computer systems learning from labelled examples","D":"Computer systems interacting through natural language"},"correct":"B","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Computer systems surpassing human capabilities"},{"id":"Q117","local":117,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":26,"q":"What is an intelligent agent in Artificial Intelligence?","options":{"A":"An entity that perceives through sensors and acts through effectors","B":"An entity that stores expert knowledge in a rule-based system","C":"An entity that assigns membership values to fuzzy propositions","D":"An entity that evaluates variable assignments under constraints"},"correct":"A","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 4)","answer_text":"An entity that perceives through sensors and acts through effectors"},{"id":"Q118","local":118,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":26,"q":"What is a percept in the terminology of intelligent agents?","options":{"A":"The complete history of the agent's observations","B":"The agent's perceptual input at a particular instant","C":"The mapping between observations and actions","D":"The criterion used to assess the agent's success"},"correct":"B","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 4)","answer_text":"The agent's perceptual input at a particular instant"},{"id":"Q119","local":119,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":26,"q":"What does the percept sequence of an intelligent agent represent?","options":{"A":"The action selected after the current observation","B":"The success criterion used to evaluate the agent","C":"The function connecting input and output actions","D":"The history of everything the agent has perceived"},"correct":"D","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 4)","answer_text":"The history of everything the agent has perceived"},{"id":"Q120","local":120,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":26,"q":"What is the function of an agent function in AI?","options":{"A":"It assigns a success score to the agent's performance.","B":"It stores the complete history of an agent's actions.","C":"It maps percept sequences to corresponding actions.","D":"It records the individual inputs received by sensors."},"correct":"C","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 4)","answer_text":"It maps percept sequences to corresponding actions."},{"id":"Q121","local":121,"group":"topic-10","topic":"AI Foundations, History, Types, and Agents","page":26,"q":"What does the performance measure of an agent determine?","options":{"A":"The sequence of perceptions received by the agent","B":"The criteria used to determine how successful the agent is","C":"The hardware components through which the agent acts","D":"The mapping between the agent's inputs and actions"},"correct":"B","source":"(Topic: AI Foundations, History, Types, and Agents | Source: Introduction to AI and types of learning.docx, p. 4)","answer_text":"The criteria used to determine how successful the agent is"},{"id":"Q122","local":122,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":27,"q":"What is the primary function of vision systems in Artificial Intelligence?","options":{"A":"Understanding spoken sentences and their meanings","B":"Interpreting rules to provide expert recommendations","C":"Learning the relationships within unlabelled datasets","D":"Understanding and interpreting visual input"},"correct":"D","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: Introduction to AI and types of learning.docx, p. 2)","answer_text":"Understanding and interpreting visual input"},{"id":"Q123","local":123,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":27,"q":"What is the primary focus of Natural Language Processing (NLP)?","options":{"A":"Evaluating the best moves in strategic games","B":"Identifying patterns from numerical sensor values","C":"Processing and communicating through human language","D":"Assigning probability values to uncertain outcomes"},"correct":"C","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: Introduction to AI and types of learning.docx, pp. 2–3)","answer_text":"Processing and communicating through human language"},{"id":"Q124","local":124,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":27,"q":"Which capability is specifically associated with speech recognition in the uploaded material?","options":{"A":"Converting handwritten characters into editable text","B":"Interpreting visual inputs from computer images","C":"Assigning values to uncertain fuzzy statements","D":"Understanding spoken language despite accents and background noise"},"correct":"D","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: Introduction to AI and types of learning.docx, p. 2)","answer_text":"Understanding spoken language despite accents and background noise"},{"id":"Q125","local":125,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":27,"q":"What does handwriting recognition software do?","options":{"A":"Predicts the next action from a sequence of perceptions","B":"Recognizes handwritten characters and converts them into editable text","C":"Determines the best response in a two-player game","D":"Classifies unlabelled records according to hidden patterns"},"correct":"B","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: Introduction to AI and types of learning.docx, p. 2)","answer_text":"Recognizes handwritten characters and converts them into editable text"},{"id":"Q126","local":126,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":27,"q":"How are AI robots described in the uploaded material?","options":{"A":"Artificial agents that act in real-world environments","B":"Knowledge bases that store domain-specific expertise","C":"Algorithms that assign binary truth values to propositions","D":"Probabilistic programs that model uncertain information"},"correct":"A","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: Introduction to AI and types of learning.docx, p. 3)","answer_text":"Artificial agents that act in real-world environments"},{"id":"Q127","local":127,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":28,"q":"What is Machine Learning according to the PowerPoint study material?","options":{"A":"A method for manually organizing knowledge into logical rules","B":"A technique for connecting propositions using logical operators","C":"A field developing algorithms that learn from data and improve over time","D":"A framework for assigning possible values to constrained variables"},"correct":"C","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 6)","answer_text":"A field developing algorithms that learn from data and improve over time"},{"id":"Q128","local":128,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":28,"q":"Which description best represents Deep Learning?","options":{"A":"A search technique using estimated distances to a goal","B":"A decision process using explicit IF-THEN-ELSE rules","C":"A machine-learning approach using multilayer neural networks","D":"A constraint method using variables and allowable domains"},"correct":"C","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 6)","answer_text":"A machine-learning approach using multilayer neural networks"},{"id":"Q129","local":129,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":28,"q":"According to the AI techniques slide, Convolutional Neural Networks (CNNs) are used for which purpose?","options":{"A":"Image recognition and classification","B":"Natural language and speech recognition","C":"Decision-making using rewards and penalties","D":"Rule-based reasoning and expert diagnosis"},"correct":"A","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 7)","answer_text":"Image recognition and classification"},{"id":"Q130","local":130,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":28,"q":"Which application is associated with Recurrent Neural Networks (RNNs) in the PowerPoint material?","options":{"A":"Image classification and visual recognition","B":"Knowledge acquisition and rule organization","C":"Constraint propagation and map colouring","D":"Natural language processing and speech recognition"},"correct":"D","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 7)","answer_text":"Natural language processing and speech recognition"},{"id":"Q131","local":131,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":28,"q":"What is a capability of Generative Adversarial Networks (GANs) highlighted in the slides?","options":{"A":"Determining the truth values of logical propositions","B":"Searching graph vertices using stacks and queues","C":"Assigning values that satisfy problem constraints","D":"Generating realistic images, videos, and audio"},"correct":"D","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 10)","answer_text":"Generating realistic images, videos, and audio"},{"id":"Q132","local":132,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":29,"q":"How can AI contribute to healthcare according to the uploaded presentation?","options":{"A":"By analysing traffic patterns to optimize routes","B":"By examining financial records to identify fraud","C":"By analysing medical images to assist disease diagnosis","D":"By generating virtual environments for gaming"},"correct":"C","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 5)","answer_text":"By analysing medical images to assist disease diagnosis"},{"id":"Q133","local":133,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":29,"q":"Which application of AI in finance is mentioned in the PowerPoint slides?","options":{"A":"Detecting fraud and predicting market trends","B":"Detecting traffic congestion and adjusting routes","C":"Identifying diseases from medical photographs","D":"Recognizing handwritten characters on paper"},"correct":"A","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 5)","answer_text":"Detecting fraud and predicting market trends"},{"id":"Q134","local":134,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":29,"q":"According to the AI transportation applications slide, how can AI improve transportation?","options":{"A":"By identifying patterns in medical records","B":"By analysing traffic to optimize routes and reduce congestion","C":"By generating images for virtual environments","D":"By discovering fraudulent financial transactions"},"correct":"B","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 5)","answer_text":"By analysing traffic to optimize routes and reduce congestion"},{"id":"Q135","local":135,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":29,"q":"Which ethical concern about AI's impact on the workforce is discussed in the study material?","options":{"A":"Uncertainty caused by model hyperparameter selection","B":"Conflicts between multiple expert-system rules","C":"Difficulty interpreting intermediate fuzzy truth values","D":"Potential unemployment and economic disruption from automation"},"correct":"D","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 11)","answer_text":"Potential unemployment and economic disruption from automation"},{"id":"Q136","local":136,"group":"topic-11","topic":"AI Domains, Applications, Techniques, and Ethics","page":29,"q":"Which issue is highlighted under data privacy in the AI ethics slide?","options":{"A":"Personal information being misused or stolen","B":"Game-tree nodes being removed during pruning","C":"Unlabelled data containing hidden relationships","D":"Search algorithms lacking additional goal knowledge"},"correct":"A","source":"(Topic: AI Domains, Applications, Techniques, and Ethics | Source: introduction to AI.pptx, slide 11)","answer_text":"Personal information being misused or stolen"},{"id":"Q137","local":137,"group":"topic-12","topic":"Types of Learning","page":30,"q":"What is the defining characteristic of supervised learning?","options":{"A":"Training uses unclassified data without guidance.","B":"Training uses labelled data with known correct answers.","C":"Training uses feedback from rewards and punishments.","D":"Training identifies hidden patterns without a teacher."},"correct":"B","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Training uses labelled data with known correct answers."},{"id":"Q138","local":138,"group":"topic-12","topic":"Types of Learning","page":30,"q":"What kind of information is used to train a machine in unsupervised learning?","options":{"A":"Information labelled with correct answers","B":"Information evaluated using reward signals","C":"Information classified by a supervising teacher","D":"Information that is neither classified nor labelled"},"correct":"D","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Information that is neither classified nor labelled"},{"id":"Q139","local":139,"group":"topic-12","topic":"Types of Learning","page":30,"q":"What is the main principle of reinforcement learning described in the material?","options":{"A":"Learning from examples tagged with correct answers","B":"Learning by identifying patterns in unlabelled data","C":"Learning through feedback to achieve an objective","D":"Learning by remembering sequences of past events"},"correct":"C","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Learning through feedback to achieve an objective"},{"id":"Q140","local":140,"group":"topic-12","topic":"Types of Learning","page":30,"q":"What does \"well-labelled data\" mean in the context of supervised learning?","options":{"A":"Data that is already tagged with the correct answer","B":"Data that contains unclassified groups of information","C":"Data that provides rewards for selected decisions","D":"Data that requires discovering hidden structures"},"correct":"A","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"Data that is already tagged with the correct answer"},{"id":"Q141","local":141,"group":"topic-12","topic":"Types of Learning","page":30,"q":"What is the main task of the machine in unsupervised learning?","options":{"A":"To predict outcomes from known correct labels","B":"To group information using similarities and patterns","C":"To select actions according to reward feedback","D":"To classify examples using a supervising teacher"},"correct":"B","source":"(Topic: Types of Learning | Source: Introduction to AI and types of learning.docx, p. 5)","answer_text":"To group information using similarities and patterns"},{"id":"Q142","local":142,"group":"topic-12","t
